
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">

<style>
html,body{
margin:0;
padding:0;
background:#000;
width:100%;
height:100%;
overflow:hidden;
}

.player-area{
position:fixed;
inset:0;
background:#000;
}

.video-container{
width:100%;
height:100%;
}

video{
width:100%;
height:100%;
object-fit:contain;
background:#000;
}
</style>
</head>

<body>

<div class="player-area">
<div class="video-container" data-shaka-player-container>
<video autoplay playsinline webkit-playsinline data-shaka-player id="video"></video>
</div>
</div>

<script>

const params = new URLSearchParams(window.location.search);
const channelId = params.get("id");

if(!channelId){
alert("No Channel ID");
throw new Error("No ID");
}

async function loadChannel(){

try{

const res = await fetch("https://allinonereborn.online/tplay/channels.json");
const channels = await res.json();

const channel = channels.find(c => String(c.id) === String(channelId));

if(!channel){
alert("Channel Not Found");
return;
}

document.title = channel.name;

const streamConfig = {
mpd: channel.url,
drm: channel.drm || {},
token: channel.token || "",
referer: channel.referer || "https://www.tataplaybinge.com/",
userAgent: navigator.userAgent
};

initPlayer(streamConfig);

}catch(err){

console.error(err);
alert("Failed to load channel");

}

}

async function initPlayer(config){

shaka.polyfill.installAll();

if(!shaka.Player.isBrowserSupported()){
alert("Browser not supported");
return;
}

const video = document.getElementById("video");
const container = document.querySelector("[data-shaka-player-container]");

const player = new shaka.Player(video);

new shaka.ui.Overlay(player, container, video);

player.configure({
drm:{
clearKeys: config.drm
}
});

player.getNetworkingEngine().registerRequestFilter((type, request)=>{

request.headers["Referer"] = config.referer;
request.headers["User-Agent"] = config.userAgent;

if(config.token){

if(
(type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
type === shaka.net.NetworkingEngine.RequestType.SEGMENT)
&& !request.uris[0].includes("__hdnea")
){

const sep = request.uris[0].includes("?") ? "&" : "?";
request.uris[0] += sep + config.token;

}

}

});

try{

await player.load(config.mpd);

video.muted = true;

setTimeout(()=>{
video.play().catch(()=>{});
},1000);

console.log("Loaded");

}catch(e){

console.error(e);
alert("Playback Error");

}

}

loadChannel();

</script>

</body>
</html>
