<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
viewport-fit=cover,
user-scalable=no">

<title id="title">Tata Play</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">

<style>

/* =========================
RESET
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Arial,sans-serif;
}

/* =========================
PLAYER ROOT
========================= */

.player-area{
position:fixed;
inset:0;
width:100vw;
height:100dvh;
background:#000;
overflow:hidden;
}

/* =========================
VIDEO WRAPPER
========================= */

.video-wrapper{
position:absolute;
inset:0;
width:100vw;
height:100dvh;
background:#000;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
}

/* =========================
SHAKA CONTAINER
========================= */

.video-container,
[data-shaka-player-container]{

position:absolute !important;
inset:0 !important;

width:100% !important;
height:100% !important;

display:flex !important;
align-items:center !important;
justify-content:center !important;

background:#000 !important;
overflow:hidden !important;

}

/* =========================
VIDEO FIX
========================= */

video{

position:absolute !important;

top:50% !important;
left:50% !important;

transform:translate(-50%,-50%) !important;

width:100vw !important;
height:100dvh !important;

max-width:100vw !important;
max-height:100dvh !important;

object-fit:contain !important;

background:#000 !important;

outline:none !important;
border:none !important;

overflow:hidden !important;

}

/* =========================
FULLSCREEN FIX
========================= */

video:fullscreen{
width:100vw !important;
height:100vh !important;
object-fit:contain !important;
background:#000 !important;
}

video:-webkit-full-screen{
width:100vw !important;
height:100vh !important;
object-fit:contain !important;
background:#000 !important;
}

.player-area:fullscreen{
background:#000 !important;
}

.player-area:-webkit-full-screen{
background:#000 !important;
}

/* =========================
PREVENT SHAKA GLITCH
========================= */

.shaka-video-container video{
width:100vw !important;
height:100dvh !important;
object-fit:contain !important;
}

.shaka-controls-container{
z-index:99999 !important;
padding-bottom:max(env(safe-area-inset-bottom),8px) !important;
}

.shaka-bottom-controls{
padding-left:8px !important;
padding-right:8px !important;
box-sizing:border-box !important;
}

/* =========================
HEADER
========================= */

.header{

position:absolute;

top:max(env(safe-area-inset-top),12px);
left:12px;
right:12px;

z-index:999999;

display:flex;
align-items:center;
gap:12px;

padding:12px 14px;

background:rgba(0,0,0,.72);

backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);

border-radius:16px;

transition:opacity .3s ease;

}

/* =========================
BACK BUTTON
========================= */

.back-btn{

width:42px;
height:42px;

display:flex;
align-items:center;
justify-content:center;

border-radius:50%;

background:rgba(255,255,255,.08);

font-size:24px;
font-weight:bold;

color:#fff;
text-decoration:none;

flex-shrink:0;

}

/* =========================
CHANNEL INFO
========================= */

.channel-meta{
overflow:hidden;
}

.channel-meta strong{

display:block;

font-size:15px;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

}

.channel-meta small{
opacity:.7;
font-size:12px;
}

/* =========================
STATUS
========================= */

.status{

position:absolute;

top:50%;
left:50%;

transform:translate(-50%,-50%);

z-index:99999;

background:rgba(0,0,0,.82);

padding:22px 28px;

border-radius:18px;

font-size:15px;
text-align:center;

backdrop-filter:blur(12px);

min-width:220px;

}

/* =========================
LANDSCAPE FIX
========================= */

@media screen and (orientation:landscape){

html,
body,
.player-area{
width:100vw !important;
height:100vh !important;
overflow:hidden !important;
}

video{
width:100vw !important;
height:100vh !important;
object-fit:contain !important;
}

.header{
top:10px;
left:10px;
right:auto;
max-width:320px;
}

}

/* =========================
PORTRAIT FIX
========================= */

@media screen and (orientation:portrait){

video{
width:100vw !important;
height:100dvh !important;
object-fit:contain !important;
}

}

/* =========================
SMALL DEVICE FIX
========================= */

@media (max-width:480px){

.header{
padding:10px 12px;
gap:10px;
}

.back-btn{
width:38px;
height:38px;
font-size:22px;
}

.channel-meta strong{
font-size:14px;
}

.channel-meta small{
font-size:11px;
}

.status{
width:85%;
font-size:14px;
}

}

</style>

</head>

<body>

<div class="player-area" id="playerArea">

<div class="header" id="header">

<a href="index.html" class="back-btn">
←
</a>

<div class="channel-meta">
<strong id="chName">
Loading Channel...
</strong>

<small id="chInfo">
Tata Play
</small>
</div>

</div>

<div class="status" id="status">
Connecting...
</div>

<div class="video-wrapper">

<div
data-shaka-player-container
class="video-container"
style="width:100%;height:100%;">

<video
id="video"
autoplay
playsinline
webkit-playsinline
></video>

</div>

</div>

</div>

<script>

const CORS_PROXY = "https://corsproxy.io/?";

const id =
new URLSearchParams(location.search)
.get('id');

/* =========================
FETCH STREAM CONFIG
========================= */

async function fetchStreamConfig(){

try{

const target =
`https://allinonereborn.online/tplay/play.php?id=${id}`;

const res =
await fetch(
CORS_PROXY + encodeURIComponent(target)
);

const html =
await res.text();

let configText =
html.match(
/const streamConfig\s*=\s*(\{[\s\S]*?\};)/
)[1];

const name =
configText.match(
/name:\s*["']([^"']+)["']/
)[1];

const mpd =
configText.match(
/mpd:\s*["']([^"']+)["']/
)[1];

const token =
configText.match(
/token:\s*["']([^"']+)["']/
)[1];

const referer =
configText.match(
/referer:\s*["']([^"']+)["']/
)[1];

const userAgent =
configText.match(
/userAgent:\s*["']([^"']+)["']/
)[1];

const drmMatch =
configText.match(
/drm:\s*\{([^}]+)\}/
);

let drm = {};

if(drmMatch){

const key =
drmMatch[1].match(
/["']([^"']+)["']\s*:\s*["']([^"']+)["']/
);

if(key){
drm[key[1]] = key[2];
}

}

const streamConfig = {
name,
mpd,
token,
referer,
userAgent,
drm
};

document.getElementById('chName')
.textContent = streamConfig.name;

document.getElementById('title')
.textContent =
streamConfig.name + " — Tata Play";

document.getElementById('status')
.style.display = 'none';

initPlayer(streamConfig);

}catch(e){

console.error(e);

document.getElementById('status')
.innerHTML =
`❌ Failed to load<br><small>Try again</small>`;

}

}

/* =========================
INIT PLAYER
========================= */

function initPlayer(config){

shaka.polyfill.installAll();

if(!shaka.Player.isBrowserSupported()){

alert("Browser not supported");

return;

}

const video =
document.getElementById('video');

const container =
document.querySelector(
'[data-shaka-player-container]'
);

const player =
new shaka.Player(video);

const ui =
new shaka.ui.Overlay(
player,
container,
video
);

ui.configure({

controlPanelElements:[
'play_pause',
'time_and_duration',
'spacer',
'mute',
'volume',
'fullscreen',
'overflow_menu'
],

overflowMenuButtons:[
'quality',
'language',
'playback_rate'
]

});

player.configure({

drm:{
clearKeys: config.drm || {}
},

streaming:{
bufferingGoal:30,
rebufferingGoal:15
}

});

player.getNetworkingEngine()
.registerRequestFilter((type,request)=>{

if(config.referer){
request.headers['Referer'] =
config.referer;
}

if(config.userAgent){
request.headers['User-Agent'] =
config.userAgent;
}

const url = request.uris[0];

if(
(url.includes('manifest.mpd') ||
url.includes('/output/'))
&& config.token
){

const sep =
url.includes('?') ? '&' : '?';

request.uris[0] =
url + sep + config.token;

}

});

player.load(config.mpd)

.then(async ()=>{

console.log("✅ Stream Started!");

try{

await video.play();

}catch(e){

console.log(e);

}

})

.catch(err=>{

console.error(err);

alert(
"Stream load failed.\nToken may be expired."
);

});

}

/* =========================
AUTO HEADER HIDE
========================= */

let hideTimer;

function showHeader(){

const header =
document.getElementById("header");

header.style.opacity = "1";

clearTimeout(hideTimer);

hideTimer = setTimeout(()=>{

header.style.opacity = "0";

},4000);

}

document.addEventListener(
"mousemove",
showHeader
);

document.addEventListener(
"touchstart",
showHeader
);

showHeader();

/* =========================
START
========================= */

if(id){

fetchStreamConfig();

}else{

document.getElementById('status')
.textContent = "No Channel ID";

}

</script>

</body>
</html>
