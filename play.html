<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
viewport-fit=cover,
user-scalable=no">

<title id="title">Tata Play</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>

<style>

/* =========================
ROOT
========================= */

:root{
  --header-height:64px;
  --bg-body:#0d0d18;
  --bg-card:#13131f;
  --border:rgba(255,255,255,.07);
  --text:#f0f0f5;
  --text2:#8888aa;
  --accent:#e8534a;
  --radius:16px;
}

/* =========================
RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  background:var(--bg-body);
  color:var(--text);
  overflow-x:hidden;
  font-family:sans-serif;
}

body{
  background:var(--bg-body);
  min-height:100vh;
}

/* =========================
HEADER
========================= */

.app-header{
  position:sticky;
  top:0;
  z-index:99999;

  height:var(--header-height);

  display:flex;
  align-items:center;
  gap:14px;

  padding:0 16px;

  background:rgba(13,13,24,.92);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border-bottom:1px solid var(--border);
}

.back-btn{
  width:40px;
  height:40px;

  border-radius:50%;

  background:#1a1a2e;

  border:1px solid var(--border);

  color:#fff;

  text-decoration:none;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:20px;
}

.channel-wrap{
  display:flex;
  align-items:center;
  gap:12px;

  min-width:0;
}

.channel-logo{
  width:42px;
  height:42px;

  border-radius:50%;

  object-fit:cover;

  background:#fff;
}

.channel-text{
  min-width:0;
}

.channel-text h1{
  font-size:15px;
  font-weight:700;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.channel-text p{
  font-size:12px;
  color:var(--text2);
  margin-top:2px;
}

/* =========================
PLAYER AREA
========================= */

.player-area{
  width:100%;
  min-height:100vh;
  overflow:visible;
}
/* =========================
VIDEO CONTAINER
========================= */

.video-container{
  width:100%;
  aspect-ratio:16/9;

  background:#000;

  position:relative;

  overflow:hidden;
}

/* =========================
VIDEO
========================= */

.video-container video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}



/* =========================
STATUS
========================= */

#status{
  position:absolute;

  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  z-index:99999;

  background:rgba(0,0,0,.82);

  padding:14px 22px;

  border-radius:14px;

  font-size:14px;

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(10px);
}

/* =========================
MOBILE FIX
========================= */

@media (max-width:768px){

  html,
  body{
    background:#000;
  }

  .player-area{
    width:100%;
    height:100vh;
    overflow:hidden;
  }

  .video-container{

    width:100% !important;

    height:calc(100vh - 64px) !important;

    aspect-ratio:auto !important;

  }

  .shaka-video-container{

    width:100% !important;
    height:100% !important;

  }

  video{

    width:100% !important;
    height:100% !important;

    object-fit:contain !important;

    background:#000;

  }
  /* =========================
SHAKA MOBILE CONTROLS FIX
========================= */

.shaka-controls-container{
  opacity:1 !important;
  display:flex !important;
  visibility:visible !important;
}

.shaka-bottom-controls{
  display:flex !important;
  opacity:1 !important;
  visibility:visible !important;
}

.shaka-seek-bar-container{
  display:flex !important;
  opacity:1 !important;
  visibility:visible !important;
}

.shaka-fullscreen-button{
  display:flex !important;
}

.shaka-overflow-menu-button{
  display:flex !important;
}

.shaka-current-time,
.shaka-time-duration{
  display:block !important;
}

}

</style>

</head>

<body>

<div class="player-area">

<!-- HEADER -->

<header class="app-header">

<a href="index.html" class="back-btn">
←
</a>

<div class="channel-wrap">

<img
id="channelLogo"
class="channel-logo"
src=""
alt="logo">

<div class="channel-text">

<h1 id="chName">
Loading...
</h1>

<p>
Tata Play
</p>

</div>

</div>

</header>

<!-- PLAYER -->

<div
class="video-container"
data-shaka-player-container>

<video
id="video"
autoplay
muted
playsinline
webkit-playsinline>
</video>

</div>

<!-- STATUS -->

<div id="status">
Connecting...
</div>

</div>

<script>

/* =========================
CONFIG
========================= */

const id =
new URLSearchParams(location.search)
.get("id");

let shakaPlayer = null;

/* =========================
FETCH STREAM CONFIG
========================= */

async function fetchStreamConfig(){

try{

const target =
`https://allinonereborn.online/tplay/play.php?id=${id}`;

const proxy =
"https://corsproxy.io/?";

const res =
await fetch(
proxy + encodeURIComponent(target),
{
cache:"no-cache"
}
);

if(!res.ok){

throw new Error(
"Failed to fetch stream config"
);

}

const html =
await res.text();

if(html.includes("Access denied")){

throw new Error(
"Proxy blocked request"
);

}

/* =========================
EXTRACT CONFIG
========================= */

const configText =
html.match(
/const streamConfig\s*=\s*(\{[\s\S]*?\};)/
)?.[1];

if(!configText){

throw new Error(
"streamConfig not found"
);

}

/* =========================
VALUES
========================= */

const name =
configText.match(
/name:\s*["']([^"']+)["']/
)?.[1] || "Channel";

const mpd =
configText.match(
/mpd:\s*["']([^"']+)["']/
)?.[1] || "";

const token =
configText.match(
/token:\s*["']([^"']+)["']/
)?.[1] || "";

const referer =
configText.match(
/referer:\s*["']([^"']+)["']/
)?.[1] || "";

const userAgent =
configText.match(
/userAgent:\s*["']([^"']+)["']/
)?.[1] || navigator.userAgent;

/* =========================
DRM
========================= */

const drmMatch =
configText.match(
/drm:\s*\{([^}]+)\}/
);

let drm = {};

if(drmMatch){

const key =
drmMatch[1].match(
/["']([^"']+)["']\s*:\s*["']([^"']+)["']/
);

if(key){

drm[key[1]] = key[2];

}

}

/* =========================
LOGO
========================= */

let logo = "";

const logoMatch =
html.match(
/const CHANNEL_LOGO = ["']([^"']+)["']/
);

if(logoMatch){

logo = logoMatch[1];

}

/* =========================
FINAL CONFIG
========================= */

const streamConfig = {

name,
mpd,
token,
referer,
userAgent,
drm,
logo

};

/* =========================
UPDATE UI
========================= */

document.getElementById("title")
.textContent =
streamConfig.name;

document.getElementById("chName")
.textContent =
streamConfig.name;

document.getElementById("channelLogo")
.src =
streamConfig.logo;

document.getElementById("status")
.style.display = "none";

/* =========================
START PLAYER
========================= */

initPlayer(streamConfig);

}catch(e){

console.error(e);

document.getElementById("status")
.style.display = "block";

document.getElementById("status")
.innerHTML =
"❌ Failed to load stream";

}

}

/* =========================
INIT PLAYER
========================= */

function initPlayer(config){

shaka.polyfill.installAll();

if(!shaka.Player.isBrowserSupported()){

alert(
"Browser not supported"
);

return;

}

const video =
document.getElementById("video");

const videoContainer =
document.querySelector(
"[data-shaka-player-container]"
);

/* =========================
REMOVE INLINE SIZE
========================= */

video.removeAttribute("style");

/* =========================
CREATE PLAYER
========================= */

shakaPlayer =
new shaka.Player(video);

const ui =
new shaka.ui.Overlay(
shakaPlayer,
videoContainer,
video
);

/* =========================
UI CONFIG
========================= */

ui.configure({

controlPanelElements:[

'play_pause',
'time_and_duration',
'spacer',
'mute',
'volume',
'fullscreen',
'overflow_menu'

],

overflowMenuButtons:[

'quality',
'language',
'picture_in_picture',
'playback_rate'

]

});

/* =========================
PLAYER CONFIG
========================= */

shakaPlayer.configure({

drm:{
clearKeys:config.drm
},

streaming:{

bufferingGoal:30,

rebufferingGoal:15,

retryParameters:{
maxAttempts:5
}

}

});

/* =========================
REQUEST FILTER
========================= */

shakaPlayer
.getNetworkingEngine()
.clearAllRequestFilters();

shakaPlayer
.getNetworkingEngine()
.registerRequestFilter(
(type,request)=>{

request.headers['Referer'] =
config.referer;


if(
(type ===
shaka.net.NetworkingEngine
.RequestType.MANIFEST
||
type ===
shaka.net.NetworkingEngine
.RequestType.SEGMENT)
&&
config.token
&&
!request.uris[0].includes('__hdnea')
){

const sep =
request.uris[0]
.includes('?')
?
'&'
:
'?';

request.uris[0] +=
sep + config.token;

}

}
);
  

/* =========================
LOAD STREAM
========================= */
video.controls = true;
shakaPlayer.load(config.mpd)

.then(async()=>{

console.log(
"✅ Stream loaded"
);

video.muted = true;

video.defaultMuted = true;

video.autoplay = true;

video.playsInline = true;

video.setAttribute(
"playsinline",
""
);

video.setAttribute(
"webkit-playsinline",
""
);

try{

await video.play();

}catch(e){

console.log(e);

}

/* =========================
AUTO UNMUTE
========================= */

setTimeout(()=>{

video.muted = false;

},2000);

})

.catch(err=>{

console.error(err);

document.getElementById("status")
.style.display = "block";

document.getElementById("status")
.innerHTML =
"❌ Stream failed";

});

}

/* =========================
FORCE PLAY
========================= */

document.addEventListener(
"DOMContentLoaded",
()=>{

const video =
document.getElementById("video");

if(video){

const forcePlay =
async()=>{

try{

await video.play();

}catch(e){

console.log(e);

}

};

setTimeout(
forcePlay,
1200
);

document.body
.addEventListener(
"touchstart",
()=>{

forcePlay();

},
{ once:true }
);

}

});

/* =========================
START
========================= */

if(id){

fetchStreamConfig();

}else{

document.getElementById("status")
.innerHTML =
"No Channel ID";

}

</script>

</body>
</html>
