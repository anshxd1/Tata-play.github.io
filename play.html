<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title id="title">Tata Play</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">

  <style>
    body, html { margin:0; padding:0; height:100%; background:#000; overflow:hidden; font-family:Arial, sans-serif; }
    .player-area { position:fixed; top:0; left:0; width:100vw; height:100dvh; }
    .header {
      position: absolute; top: 15px; left: 15px; z-index: 10000;
      background: rgba(0,0,0,0.7); color: white; padding: 10px 15px;
      border-radius: 8px; display: flex; align-items: center; gap: 12px;
      backdrop-filter: blur(10px);
    }
    .back-btn { font-size: 28px; text-decoration: none; color: white; }
  </style>
</head>
<body>

<div class="player-area">
  <div class="header">
    <a href="index.html" class="back-btn">←</a>
    <div>
      <strong id="chName">Loading...</strong><br>
      <small id="chInfo">Tata Play Live</small>
    </div>
  </div>

  <div data-shaka-player-container style="width:100%; height:100%;">
    <video id="video" autoplay muted playsinline></video>
  </div>
</div>

<script>
// Get ID from URL
const params = new URLSearchParams(location.search);
const id = params.get('id');

if (!id) {
  document.body.innerHTML = `<h2 style="color:red;text-align:center;margin-top:50px">Channel ID missing</h2>`;
}

// Fetch config from original play.php
async function fetchStreamConfig() {
  try {
    const response = await fetch(`https://allinonereborn.online/tplay/play.php?id=${id}`);
    const html = await response.text();

    // Extract JavaScript object "streamConfig" using regex
    const configMatch = html.match(/const streamConfig\s*=\s*(\{[\s\S]*?\});/);
    
    if (configMatch) {
      let configStr = configMatch[1];
      // Fix common issues
      configStr = configStr.replace(/(\w+):/g, '"$1":');
      const streamConfig = JSON.parse(configStr);

      document.getElementById('chName').textContent = streamConfig.name || "Live Channel";
      document.getElementById('title').textContent = (streamConfig.name || "Channel") + " — Tata Play";

      initPlayer(streamConfig);
    } else {
      throw new Error("Config not found");
    }
  } catch (err) {
    console.error(err);
    document.getElementById('chName').innerHTML = `Error loading channel ${id}<br><small>Try again or check console</small>`;
  }
}

function initPlayer(config) {
  shaka.polyfill.installAll();
  const video = document.getElementById('video');
  const container = document.querySelector('[data-shaka-player-container]');

  const player = new shaka.Player(video);
  new shaka.ui.Overlay(player, container, video);

  player.configure({
    drm: { clearKeys: config.drm || {} },
    streaming: { bufferingGoal: 25, rebufferingGoal: 15 }
  });

  // Add headers & token
  player.getNetworkingEngine().registerRequestFilter((type, request) => {
    if (config.referer) request.headers['Referer'] = config.referer;
    if (config.userAgent) request.headers['User-Agent'] = config.userAgent;

    if (request.uris[0].includes('manifest.mpd') || request.uris[0].includes('/output/')) {
      const sep = request.uris[0].includes('?') ? '&' : '?';
      request.uris[0] += sep + (config.token || '');
    }
  });

  player.load(config.mpd).then(() => {
    console.log('✅ Stream started:', config.mpd);
  }).catch(e => {
    console.error(e);
    alert("Stream load failed. Channel might be geo-restricted or token expired.");
  });
}

// Start
fetchStreamConfig();
</script>
</body>
</html>
