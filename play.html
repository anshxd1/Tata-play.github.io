<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
viewport-fit=cover,
user-scalable=no">

<title id="title">Tata Play</title>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>

<style>

/* =========================
RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:sans-serif;
}

/* =========================
HEADER
========================= */

.app-header{
  position:fixed;

  top:0;
  left:0;

  width:100%;
  height:64px;

  z-index:1000;

  display:flex;
  align-items:center;
  gap:14px;

  padding:0 16px;

  background:rgba(0,0,0,.75);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  border-bottom:
  1px solid rgba(255,255,255,.08);
}

.back-btn{
  width:42px;
  height:42px;

  border-radius:50%;

  background:rgba(255,255,255,.08);

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  text-decoration:none;

  font-size:20px;
}

.channel-wrap{
  display:flex;
  align-items:center;
  gap:12px;
}

.channel-logo{
  width:42px;
  height:42px;

  border-radius:50%;

  object-fit:cover;

  background:#fff;
}

.channel-text h1{
  margin:0;
  color:#fff;
  font-size:15px;
}

.channel-text p{
  margin:2px 0 0;
  color:#aaa;
  font-size:12px;
}

/* =========================
PLAYER AREA
========================= */

.player-area{
  position:relative;
  width:100%;
  height:100vh;
  background:#000;
}

/* =========================
VIDEO CONTAINER
========================= */

.video-container{
  position:absolute;

  top:64px;
  left:0;

  width:100%;
  height:calc(100vh - 64px);

  background:#000;

  overflow:hidden;
}

/* =========================
SHAKA
========================= */

.shaka-video-container{
  width:100% !important;
  height:100% !important;
  background:#000 !important;
}

/* =========================
VIDEO
========================= */

video{
  width:100% !important;
  height:100% !important;

  object-fit:contain !important;

  background:#000 !important;
}

/* =========================
SHAKA CONTROLS
========================= */

.shaka-controls-container{
  opacity:1 !important;
  visibility:visible !important;
  z-index:99999 !important;
}

.shaka-bottom-controls{
  display:flex !important;
}

.shaka-seek-bar-container{
  display:flex !important;
}

.shaka-fullscreen-button{
  display:flex !important;
}

.shaka-overflow-menu-button{
  display:flex !important;
}

.shaka-current-time,
.shaka-time-duration{
  display:block !important;
}

.shaka-small-play-button{
  display:none !important;
}

/* =========================
STATUS
========================= */

#status{
  position:absolute;

  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  z-index:9999;

  background:rgba(0,0,0,.75);

  padding:14px 20px;

  border-radius:12px;

  color:#fff;
}

/* =========================
FULLSCREEN
========================= */

.shaka-video-container:fullscreen,
video:fullscreen{
  width:100vw !important;
  height:100vh !important;
  background:#000 !important;
}

.shaka-video-container:-webkit-full-screen,
video:-webkit-full-screen{
  width:100vw !important;
  height:100vh !important;
  background:#000 !important;
}

/* =========================
MOBILE
========================= */

@media (max-width:768px){

  .video-container{
    top:64px;
    width:100%;
    height:calc(100dvh - 64px);
  }

  video{
    object-fit:contain !important;
  }

}

</style>

</head>

<body>

<div class="player-area">

<!-- HEADER -->

<header class="app-header">

<a href="index.html" class="back-btn">
←
</a>

<div class="channel-wrap">

<img
id="channelLogo"
class="channel-logo"
src=""
alt="logo">

<div class="channel-text">

<h1 id="chName">
Loading...
</h1>

<p>
Tata Play
</p>

</div>

</div>

</header>

<!-- PLAYER -->

<div
class="video-container"
data-shaka-player-container>

<video
id="video"
autoplay
muted
playsinline
webkit-playsinline>
</video>

</div>

<!-- STATUS -->

<div id="status">
Connecting...
</div>

</div>

<script>

/* =========================
CONFIG
========================= */

const id =
new URLSearchParams(location.search)
.get("id");

let shakaPlayer = null;

/* =========================
FETCH CONFIG
========================= */

async function fetchStreamConfig(){

try{

const target =
`https://allinonereborn.online/tplay/play.php?id=${id}`;

const proxy =
"https://corsproxy.io/?";

const res =
await fetch(
proxy + encodeURIComponent(target),
{
cache:"no-cache"
}
);

if(!res.ok){

throw new Error(
"Failed to fetch config"
);

}

const html =
await res.text();

/* =========================
PARSE CONFIG
========================= */

const configText =
html.match(
/const streamConfig\s*=\s*(\{[\s\S]*?\};)/
)?.[1];

if(!configText){

throw new Error(
"streamConfig not found"
);

}

const name =
configText.match(
/name:\s*["']([^"']+)["']/
)?.[1] || "Channel";

const mpd =
configText.match(
/mpd:\s*["']([^"']+)["']/
)?.[1] || "";

const token =
configText.match(
/token:\s*["']([^"']+)["']/
)?.[1] || "";

const drmMatch =
configText.match(
/drm:\s*\{([^}]+)\}/
);

let drm = {};

if(drmMatch){

const key =
drmMatch[1].match(
/["']([^"']+)["']\s*:\s*["']([^"']+)["']/
);

if(key){

drm[key[1]] = key[2];

}

}

let logo = "";

const logoMatch =
html.match(
/const CHANNEL_LOGO = ["']([^"']+)["']/
);

if(logoMatch){

logo = logoMatch[1];

}

const streamConfig = {

name,
mpd,
token,
drm,
logo

};

/* =========================
UPDATE UI
========================= */

document.getElementById("title")
.textContent =
streamConfig.name;

document.getElementById("chName")
.textContent =
streamConfig.name;

document.getElementById("channelLogo")
.src =
streamConfig.logo;

document.getElementById("status")
.style.display = "none";

/* =========================
INIT PLAYER
========================= */

initPlayer(streamConfig);

}catch(e){

console.error(e);

document.getElementById("status")
.style.display = "block";

document.getElementById("status")
.innerHTML =
"❌ Failed to load stream";

}

}

/* =========================
INIT PLAYER
========================= */

function initPlayer(config){

shaka.polyfill.installAll();

if(!shaka.Player.isBrowserSupported()){

alert(
"Browser not supported"
);

return;

}

const video =
document.getElementById("video");

const container =
document.querySelector(
"[data-shaka-player-container]"
);

video.removeAttribute("style");

video.crossOrigin = "anonymous";

/* =========================
CREATE PLAYER
========================= */

shakaPlayer =
new shaka.Player(video);

const ui =
new shaka.ui.Overlay(
shakaPlayer,
container,
video
);

/* =========================
UI CONFIG
========================= */

ui.configure({

addSeekBar:true,

controlPanelElements:[

'play_pause',

'time_and_duration',

'spacer',

'mute',

'volume',

'fullscreen',

'overflow_menu'

],

overflowMenuButtons:[

'quality',

'language',

'picture_in_picture',

'playback_rate'

],

enableKeyboardPlaybackControls:true

});

ui.getControls().setEnabled(true);

/* =========================
PLAYER CONFIG
========================= */

shakaPlayer.configure({

drm:{
clearKeys:config.drm
},

streaming:{

bufferingGoal:30,

rebufferingGoal:15,

retryParameters:{
maxAttempts:5
}

}

});

/* =========================
REQUEST FILTER
========================= */

shakaPlayer
.getNetworkingEngine()
.clearAllRequestFilters();

shakaPlayer
.getNetworkingEngine()
.registerRequestFilter(
(type,request)=>{

if(
(type ===
shaka.net.NetworkingEngine.RequestType.MANIFEST
||
type ===
shaka.net.NetworkingEngine.RequestType.SEGMENT)
&&
config.token
&&
!request.uris[0]
.includes('__hdnea')
){

const sep =
request.uris[0].includes('?')
?
'&'
:
'?';

request.uris[0] +=
sep + config.token;

}

}
);

/* =========================
LOAD STREAM
========================= */

shakaPlayer.load(config.mpd)

.then(async()=>{

console.log(
"✅ Stream loaded"
);

video.muted = true;

video.defaultMuted = true;

video.autoplay = true;

video.playsInline = true;

video.setAttribute(
"playsinline",
""
);

video.setAttribute(
"webkit-playsinline",
""
);

try{

await video.play();

}catch(e){

console.log(e);

}

setTimeout(()=>{

video.muted = false;

},1500);

})

.catch(err=>{

console.error(err);

document.getElementById("status")
.style.display = "block";

document.getElementById("status")
.innerHTML =
"❌ Stream failed";

});

}

/* =========================
AUTO PLAY
========================= */

document.addEventListener(
"DOMContentLoaded",
()=>{

const video =
document.getElementById("video");

const forcePlay =
async()=>{

try{

await video.play();

}catch(e){

console.log(e);

}

};

setTimeout(
forcePlay,
1200
);

document.body.addEventListener(
"touchstart",
()=>{

forcePlay();

},
{ once:true }
);

}
);

/* =========================
START
========================= */

if(id){

fetchStreamConfig();

}else{

document.getElementById("status")
.innerHTML =
"No Channel ID";

}

</script>

</body>
</html>
