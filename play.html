<style>
/* ===== CSS VARIABLES — Match index.php dark theme ===== */
:root {
  --header-height: 64px;
  --bg-body: #0d0d18;
  --bg-card: #13131f;
  --bg-card2: #1a1a2e;
  --bg-glass: rgba(19,19,31,0.85);
  --border: rgba(255,255,255,0.07);
  --accent: #e8534a;
  --accent-2: #3b82f6;
  --accent-glow: rgba(232,83,74,0.25);
  --text-primary: #f0f0f5;
  --text-secondary: #8888aa;
  --text-muted: #555570;
  --live-red: #e8534a;
  --shadow: 0 8px 32px rgba(0,0,0,0.5);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 6px;
  --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ===== RESET ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  background: var(--bg-body);
  color: var(--text-primary);
  font-family: 'Outfit', sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body {
  background: var(--bg-body);
  min-height: 100vh;
  padding-bottom: 32px;
}

/* ===== HEADER ===== */
.app-header {
  position: sticky;
  top: 0;
  z-index: 200;
  height: var(--header-height);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: rgba(13,13,24,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 4px 24px rgba(0,0,0,0.4);
}

.logo {
  font-size: 20px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent), #ff8a65);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.3px;
}

.back-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--bg-card2);
  border: 1px solid var(--border);
  color: var(--text-primary);
  text-decoration: none;
  transition: var(--transition);
}
.back-btn:hover { background: var(--accent); transform: scale(1.05); }
.back-btn .material-icons-round { font-size: 20px; }

/* ===== PLAYER AREA ===== */
.player-area {
  width: 100%;
  background: #000;
  position: relative;
}

.video-container {
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  position: relative;
  border-radius: 0;
  overflow: hidden;
}

/* Round the player bottom corners */
.video-container video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 0 0 var(--radius) var(--radius);
}

/* Shaka UI overlay rounded bottom corners */
.shaka-video-container {
  border-radius: 0 0 var(--radius) var(--radius) !important;
  overflow: hidden !important;
}

/* ===== INFO SECTION ===== */
.info-section {
  max-width: 100%;
  padding: 0 16px;
}

/* ===== CHANNEL HEADER ===== */
.channel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 0 14px;
  gap: 12px;
}

.channel-identity {
  display: flex;
  align-items: center;
  gap: 14px;
  flex: 1;
  min-width: 0;
}

.channel-logo {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  object-fit: cover;
  background: #fff;
  border: 2px solid var(--border);
  flex-shrink: 0;
}

.channel-text h1 {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 180px;
}

.channel-text p {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 3px;
}

.badges {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-shrink: 0;
}

.badge {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.badge-live {
  background: var(--live-red);
  color: #fff;
  display: flex;
  align-items: center;
  gap: 4px;
}

.badge-live::before {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #fff;
  animation: livePulse 1.2s ease-in-out infinite;
}

@keyframes livePulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.7); }
}

.badge-hd {
  background: var(--accent-2);
  color: #fff;
}

.badge-sd {
  background: var(--text-muted);
  color: #fff;
}

/* ===== ACTION BUTTONS ROW ===== */
.action-row {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}

.action-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-primary);
  font-family: 'Outfit', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  flex: 1;
  justify-content: center;
  min-width: 120px;
}

.action-btn .material-icons-round { font-size: 18px; }

.action-btn:hover, .action-btn:active {
  background: var(--bg-card2);
  border-color: var(--accent);
  transform: translateY(-1px);
}

.action-btn.fav-active {
  background: rgba(232,83,74,0.15);
  border-color: var(--accent);
  color: var(--accent);
}

.action-btn.catchup-btn {
  background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(99,102,241,0.15));
  border-color: rgba(59,130,246,0.4);
  color: #60a5fa;
  flex: 2;
}

.action-btn.catchup-btn:hover {
  background: linear-gradient(135deg, rgba(59,130,246,0.25), rgba(99,102,241,0.25));
  border-color: #3b82f6;
}

/* ===== SECTION HEADERS ===== */
.section-header {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
  margin: 20px 0 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-header::before {
  content: '';
  display: inline-block;
  width: 3px;
  height: 16px;
  border-radius: 2px;
  background: var(--accent);
}

/* ===== CURRENT PROGRAM ===== */
.current-program {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 4px;
}

.program-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 6px;
}

.program-time {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 10px;
  display: flex;
  gap: 6px;
  align-items: center;
}

.program-time span + span::before { content: '→'; margin-right: 6px; }

.progress-track {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 12px;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), #ff8a65);
  border-radius: 2px;
  transition: width 1s linear;
}

.description {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
}

.full-desc { display: none; }
.full-desc.show { display: block; }
.short-desc.hide { display: none; }

.desc-toggle {
  display: inline-block;
  color: var(--accent-2);
  font-size: 12px;
  font-weight: 600;
  margin-top: 6px;
  cursor: pointer;
}

/* ===== UPCOMING CARD ===== */
.upcoming-card {
  display: flex;
  gap: 14px;
  align-items: center;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 4px;
}

.upcoming-img {
  width: 60px;
  height: 60px;
  border-radius: var(--radius-sm);
  object-fit: cover;
  background: var(--bg-card2);
  flex-shrink: 0;
}

.upcoming-details h4 {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 5px;
}

.upcoming-details p {
  font-size: 12px;
  color: var(--text-secondary);
}

/* ===== RECENTLY WATCHED ===== */
.scroll-row {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: 8px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.scroll-row::-webkit-scrollbar { display: none; }

/* ===== SIMILAR CHANNELS ===== */
.channel-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  min-width: 80px;
  max-width: 80px;
  text-decoration: none;
  cursor: pointer;
  flex-shrink: 0;
}

.channel-icon {
  position: relative;
  width: 68px;
  height: 68px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid var(--border);
  overflow: visible;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}

.channel-icon:hover {
  border-color: var(--accent);
  transform: translateY(-3px);
}

.channel-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

/* Heart button on channel icons */
.heart-btn {
  position: absolute;
  top: -4px;
  right: -4px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--bg-card);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
  transition: var(--transition);
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}

.heart-btn .material-icons-round {
  font-size: 13px;
  color: var(--text-muted);
  transition: var(--transition);
}

.heart-btn.active .material-icons-round {
  color: var(--accent);
}

.heart-btn:active {
  transform: scale(0.85);
}

.channel-title-sm {
  font-size: 11px;
  color: var(--text-secondary);
  text-align: center;
  line-height: 1.3;
  width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 80px;
}

/* ===== CATCHUP MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 500;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}

.modal-sheet {
  background: var(--bg-card);
  border-radius: var(--radius) var(--radius) 0 0;
  padding: 24px 20px 40px;
  width: 100%;
  max-width: 520px;
  border-top: 1px solid var(--border);
  box-shadow: 0 -16px 60px rgba(0,0,0,0.6);
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

.modal-overlay.open .modal-sheet {
  transform: translateY(0);
}

.modal-handle {
  width: 40px;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  margin: 0 auto 20px;
}

.modal-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.modal-title .material-icons-round {
  color: var(--accent-2);
  font-size: 20px;
}

.modal-subtitle {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 20px;
}

.modal-field {
  margin-bottom: 16px;
}

.modal-field label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 7px;
}

.modal-field input[type="datetime-local"] {
  width: 100%;
  padding: 12px 14px;
  background: var(--bg-body);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  outline: none;
  transition: var(--transition);
  color-scheme: dark;
}

.modal-field input[type="datetime-local"]:focus {
  border-color: var(--accent-2);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
}

.modal-note {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 5px;
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.btn-cancel {
  flex: 1;
  padding: 13px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}

.btn-cancel:hover { background: var(--bg-card2); }

.btn-play {
  flex: 2;
  padding: 13px;
  border-radius: var(--radius-sm);
  border: none;
  background: linear-gradient(135deg, #3b82f6, #6366f1);
  color: #fff;
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-play:hover {
  background: linear-gradient(135deg, #2563eb, #4f46e5);
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(59,130,246,0.35);
}

.btn-play .material-icons-round { font-size: 18px; }

.modal-error {
  color: var(--accent);
  font-size: 12px;
  margin-top: 12px;
  display: none;
  padding: 10px 12px;
  background: rgba(232,83,74,0.1);
  border-radius: var(--radius-xs);
  border: 1px solid rgba(232,83,74,0.3);
}

/* ===== RECENTLY WATCHED CHANNEL ITEM ===== */
.rw-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  min-width: 72px;
  cursor: pointer;
  flex-shrink: 0;
  text-decoration: none;
}

.rw-icon {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid var(--border);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.rw-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

.rw-name {
  font-size: 10px;
  color: var(--text-secondary);
  text-align: center;
  max-width: 72px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ===== EMPTY STATE ===== */
.empty-state {
  color: var(--text-muted);
  font-size: 13px;
  padding: 16px 0;
  text-align: center;
}

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg-card2);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 10px 20px;
  border-radius: 24px;
  font-size: 13px;
  font-weight: 500;
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s ease;
  white-space: nowrap;
  box-shadow: var(--shadow);
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>

<body>

<div class="player-area">

<!-- HEADER -->

<header class="app-header" id="header">

<div class="header-left">

<a href="index.html" class="back-btn">

<span class="material-icons-round">
arrow_back
</span>

</a>

<div class="channel-meta">

<h1 id="chName">
Loading Channel...
</h1>

<p id="chInfo">
Tata Play
</p>

</div>

</div>

<div class="live-badge">

<div class="live-dot"></div>

LIVE

</div>

</header>

<!-- STATUS -->

<div class="status"
id="status">

Connecting...

</div>

<!-- VIDEO PLAYER -->

<div
class="video-container"
data-shaka-player-container>

<video
id="video"
autoplay
playsinline
webkit-playsinline
muted>
</video>

</div>

</div>

<script>

const CORS_PROXY =
"https://corsproxy.io/?";

const id =
new URLSearchParams(location.search)
.get("id");

/* =========================================
FETCH STREAM CONFIG
========================================= */

async function fetchStreamConfig(){

try{

const target =
`https://allinonereborn.online/tplay/play.php?id=${id}`;

const res =
await fetch(
CORS_PROXY + encodeURIComponent(target)
);

const html =
await res.text();

/* =========================================
EXTRACT CONFIG
========================================= */

const configText =
html.match(
/const streamConfig\s*=\s*(\{[\s\S]*?\};)/
)?.[1];

if(!configText){

throw new Error(
"streamConfig not found"
);

}

const name =
configText.match(
/name:\s*["']([^"']+)["']/
)?.[1] || "Channel";

const mpd =
configText.match(
/mpd:\s*["']([^"']+)["']/
)?.[1] || "";

const token =
configText.match(
/token:\s*["']([^"']+)["']/
)?.[1] || "";

const referer =
configText.match(
/referer:\s*["']([^"']+)["']/
)?.[1] || "";

const userAgent =
configText.match(
/userAgent:\s*["']([^"']+)["']/
)?.[1] || navigator.userAgent;

/* =========================================
DRM
========================================= */

const drmMatch =
configText.match(
/drm:\s*\{([^}]+)\}/
);

let drm = {};

if(drmMatch){

const key =
drmMatch[1].match(
/["']([^"']+)["']\s*:\s*["']([^"']+)["']/
);

if(key){

drm[key[1]] = key[2];

}

}

const streamConfig = {

name,
mpd,
token,
referer,
userAgent,
drm

};

console.log(
"STREAM CONFIG:",
streamConfig
);

/* =========================================
UI UPDATE
========================================= */

document.getElementById("chName")
.textContent = streamConfig.name;

document.getElementById("title")
.textContent =
streamConfig.name + " — Tata Play";

document.getElementById("status")
.style.display = "none";

/* =========================================
START PLAYER
========================================= */

initPlayer(streamConfig);

}catch(e){

console.error(e);

document.getElementById("status")
.innerHTML =
`❌ Failed to load<br><small>${e.message}</small>`;

}

}

/* =========================================
INIT PLAYER
========================================= */

function initPlayer(config){

shaka.polyfill.installAll();

if(!shaka.Player.isBrowserSupported()){

alert(
"Browser not supported"
);

return;

}

const video =
document.getElementById("video");

const container =
document.querySelector(
"[data-shaka-player-container]"
);

/* =========================================
IMPORTANT VIDEO FIX
========================================= */

video.style.width = "100%";
video.style.height = "100%";
video.style.objectFit = "contain";
video.style.background = "#000";

/* =========================================
CREATE PLAYER
========================================= */

const player =
new shaka.Player(video);

const ui =
new shaka.ui.Overlay(
player,
container,
video
);

/* =========================================
UI CONFIG
========================================= */

ui.configure({

controlPanelElements:[

'play_pause',
'time_and_duration',
'spacer',
'mute',
'volume',
'fullscreen',
'overflow_menu'

],

overflowMenuButtons:[

'quality',
'language',
'playback_rate'

]

});

/* =========================================
PLAYER CONFIG
========================================= */

player.configure({

drm:{
clearKeys: config.drm || {}
},

streaming:{
bufferingGoal:30,
rebufferingGoal:15
}

});

/* =========================================
REQUEST FILTER
========================================= */

player.getNetworkingEngine()
.registerRequestFilter(
(type,request)=>{

if(config.referer){

request.headers['Referer'] =
config.referer;

}

if(config.userAgent){

request.headers['User-Agent'] =
config.userAgent;

}

const url =
request.uris[0];

if(
(url.includes("manifest.mpd")
||
url.includes("/output/"))
&&
config.token
){

const sep =
url.includes("?")
?
"&"
:
"?";

request.uris[0] =
url + sep + config.token;

}

}
);

/* =========================================
LOAD STREAM
========================================= */

player.load(config.mpd)

.then(async()=>{

console.log(
"✅ Stream Started"
);

/* =========================================
UNMUTE + PLAY
========================================= */

video.muted = false;

try{

await video.play();

}catch(e){

console.log(e);

}

})

.catch(err=>{

console.error(err);

alert(
"Stream failed.\nToken expired."
);

});

}

/* =========================================
AUTO HEADER HIDE
========================================= */

let hideTimer;

function showHeader(){

const header =
document.getElementById("header");

header.style.opacity = "1";

clearTimeout(hideTimer);

hideTimer =
setTimeout(()=>{

header.style.opacity = "0";

},4000);

}

document.addEventListener(
"mousemove",
showHeader
);

document.addEventListener(
"touchstart",
showHeader
);

showHeader();

/* =========================================
START
========================================= */

if(id){

fetchStreamConfig();

}else{

document.getElementById("status")
.textContent =
"No Channel ID";

}

</script>

</body>
</html>
