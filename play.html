
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
/>

<title id="pageTitle">Tata Play</title>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css"
/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>

<style>

/* =========================
RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:sans-serif;
}

body{
  color:#fff;
}

/* =========================
APP
========================= */

.app{
  width:100%;
  height:100vh;
  background:#000;
  overflow:hidden;
  position:relative;
}

/* =========================
HEADER
========================= */

.header{
  position:fixed;
  top:0;
  left:0;

  width:100%;
  height:64px;

  display:flex;
  align-items:center;
  gap:14px;

  padding:0 16px;

  background:rgba(0,0,0,.72);

  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);

  z-index:99999;

  border-bottom:
  1px solid rgba(255,255,255,.08);
}

.back-btn{
  width:42px;
  height:42px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  text-decoration:none;

  color:#fff;

  background:rgba(255,255,255,.08);

  border:
  1px solid rgba(255,255,255,.08);

  font-size:20px;
}

.channel-info{
  display:flex;
  align-items:center;
  gap:12px;

  min-width:0;
}

.channel-logo{
  width:44px;
  height:44px;

  border-radius:50%;

  object-fit:cover;

  background:#fff;
}

.channel-meta{
  min-width:0;
}

.channel-meta h1{
  font-size:16px;
  font-weight:700;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.channel-meta p{
  font-size:12px;
  color:#aaa;
  margin-top:2px;
}

/* =========================
PLAYER WRAP
========================= */

.player-wrap{
  position:absolute;

  top:64px;
  left:0;

  width:100%;
  height:calc(100vh - 64px);

  background:#000;

  overflow:hidden;
}

/* =========================
SHAKA
========================= */

.shaka-video-container{
  width:100% !important;
  height:100% !important;
  background:#000 !important;
}

video{
  width:100% !important;
  height:100% !important;

  object-fit:contain !important;

  background:#000 !important;
}

/* =========================
CONTROLS FIX
========================= */

.shaka-controls-container{
  z-index:999999 !important;

  opacity:1 !important;
  visibility:visible !important;
}

.shaka-bottom-controls{
  display:flex !important;
  opacity:1 !important;
}

.shaka-seek-bar-container{
  display:flex !important;
  opacity:1 !important;
}

.shaka-fullscreen-button{
  display:flex !important;
}

.shaka-overflow-menu-button{
  display:flex !important;
}

.shaka-current-time,
.shaka-time-duration{
  display:block !important;
}

.shaka-small-play-button{
  display:none !important;
}

/* =========================
STATUS
========================= */

.status{
  position:absolute;

  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  z-index:999999;

  background:rgba(0,0,0,.78);

  padding:14px 22px;

  border-radius:14px;

  font-size:14px;

  border:
  1px solid rgba(255,255,255,.08);
}

/* =========================
FULLSCREEN FIX
========================= */

.shaka-video-container:fullscreen,
video:fullscreen{
  width:100vw !important;
  height:100vh !important;
  background:#000 !important;
}

.shaka-video-container:-webkit-full-screen,
video:-webkit-full-screen{
  width:100vw !important;
  height:100vh !important;
  background:#000 !important;
}

/* =========================
MOBILE
========================= */

@media(max-width:768px){

  .player-wrap{
    height:calc(100dvh - 64px);
  }

  video{
    object-fit:contain !important;
  }

}

</style>

</head>
<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <a href="index.html" class="back-btn">
      ←
    </a>

    <div class="channel-info">

      <img
        id="channelLogo"
        class="channel-logo"
        src=""
        alt="logo"
      />

      <div class="channel-meta">
        <h1 id="channelName">Loading...</h1>
        <p>Tata Play</p>
      </div>

    </div>

  </header>

  <!-- PLAYER -->

  <div
    class="player-wrap"
    data-shaka-player-container
  >

    <video
      id="video"
      autoplay
      muted
      playsinline
      webkit-playsinline
    ></video>

  </div>

  <!-- STATUS -->

  <div
    id="status"
    class="status"
  >
    Connecting...
  </div>

</div>

<script>

/* =========================
GET CHANNEL ID
========================= */

const id =
new URLSearchParams(location.search)
.get("id");

let player = null;

/* =========================
FETCH CONFIG
========================= */

async function fetchStreamConfig(){

  try{

    const target =
    `https://allinonereborn.online/tplay/play.php?id=${id}`;

    const proxy =
    `https://corsproxy.io/?${encodeURIComponent(target)}`;

    const res =
    await fetch(proxy,{
      cache:"no-cache"
    });

    if(!res.ok){
      throw new Error(
        "Fetch failed"
      );
    }

    const html =
    await res.text();

    const configBlock =
    html.match(
      /const streamConfig\s*=\s*(\{[\s\S]*?\};)/
    )?.[1];

    if(!configBlock){
      throw new Error(
        "streamConfig not found"
      );
    }

    const name =
    configBlock.match(
      /name:\s*["']([^"']+)["']/
    )?.[1] || "Channel";

    const mpd =
    configBlock.match(
      /mpd:\s*["']([^"']+)["']/
    )?.[1] || "";

    const token =
    configBlock.match(
      /token:\s*["']([^"']+)["']/
    )?.[1] || "";

    const drmMatch =
    configBlock.match(
      /drm:\s*\{([^}]+)\}/
    );

    let drm = {};

    if(drmMatch){

      const key =
      drmMatch[1].match(
        /["']([^"']+)["']\s*:\s*["']([^"']+)["']/
      );

      if(key){
        drm[key[1]] = key[2];
      }

    }

    const logo =
    html.match(
      /const CHANNEL_LOGO = ["']([^"']+)["']/
    )?.[1] || "";

    document.getElementById(
      "pageTitle"
    ).textContent = name;

    document.getElementById(
      "channelName"
    ).textContent = name;

    document.getElementById(
      "channelLogo"
    ).src = logo;

    document.getElementById(
      "status"
    ).style.display = "none";

    initPlayer({
      name,
      mpd,
      token,
      drm
    });

  }catch(err){

    console.error(err);

    document.getElementById(
      "status"
    ).innerHTML =
    "❌ Failed to load stream";

  }

}

/* =========================
INIT PLAYER
========================= */

function initPlayer(config){

  shaka.polyfill.installAll();

  if(!shaka.Player.isBrowserSupported()){

    alert(
      "Browser not supported"
    );

    return;

  }

  const video =
  document.getElementById("video");

  const container =
  document.querySelector(
    "[data-shaka-player-container]"
  );

  player =
  new shaka.Player(video);

  const ui =
  new shaka.ui.Overlay(
    player,
    container,
    video
  );

  /* =========================
  UI CONFIG
  ========================= */

  ui.configure({

    addSeekBar:true,

    controlPanelElements:[

      'play_pause',

      'time_and_duration',

      'spacer',

      'mute',

      'volume',

      'fullscreen',

      'overflow_menu'

    ],

    overflowMenuButtons:[

      'quality',

      'language',

      'playback_rate',

      'picture_in_picture'

    ],

    enableKeyboardPlaybackControls:true

  });

  ui.getControls().setEnabled(true);

  /* =========================
  DRM
  ========================= */

  player.configure({

    drm:{
      clearKeys:config.drm
    },

    streaming:{

      bufferingGoal:30,

      rebufferingGoal:15,

      retryParameters:{
        maxAttempts:5
      }

    }

  });

  /* =========================
  TOKEN FILTER
  ========================= */

  player
  .getNetworkingEngine()
  .clearAllRequestFilters();

  player
  .getNetworkingEngine()
  .registerRequestFilter(
    (type,request)=>{

      if(
        (
          type ===
          shaka.net.NetworkingEngine.RequestType.MANIFEST
          ||
          type ===
          shaka.net.NetworkingEngine.RequestType.SEGMENT
        )
        &&
        config.token
        &&
        !request.uris[0]
        .includes('__hdnea')
      ){

        const sep =
        request.uris[0].includes('?')
        ? '&'
        : '?';

        request.uris[0] +=
        sep + config.token;

      }

    }
  );

  /* =========================
  LOAD STREAM
  ========================= */

  player.load(config.mpd)

  .then(async()=>{

    try{

      await video.play();

    }catch(e){

      console.log(e);

    }

  })

  .catch(err=>{

    console.error(err);

    document.getElementById(
      "status"
    ).style.display = "block";

    document.getElementById(
      "status"
    ).innerHTML =
    "❌ Stream failed";

  });

}

/* =========================
START
========================= */

if(id){

  fetchStreamConfig();

}else{

  document.getElementById(
    "status"
  ).innerHTML =
  "No Channel ID";

}

</script>

</body>
</html>
