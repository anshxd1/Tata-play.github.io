<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title id="title">Tata Play</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">

  <style>
    body, html { margin:0; padding:0; height:100%; background:#000; overflow:hidden; color:white; font-family:Arial, sans-serif; }
    .player-area { position:fixed; top:0; left:0; width:100vw; height:100dvh; }
    .header {
      position: absolute; top: 15px; left: 15px; z-index: 10000;
      background: rgba(0,0,0,0.85); padding: 12px 16px; border-radius: 12px;
      display: flex; align-items: center; gap: 12px;
    }
    .back-btn { font-size: 30px; color: white; text-decoration: none; }
    .status { 
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
      z-index: 100; text-align:center; background:rgba(0,0,0,0.8); padding:25px; border-radius:12px;
    }
  </style>
</head>
<body>

<div class="player-area">
  <div class="header">
    <a href="index.html" class="back-btn">←</a>
    <div><strong id="chName">Loading Channel...</strong><br><small id="chInfo">Tata Play</small></div>
  </div>

  <div class="status" id="status">Connecting...</div>

  <div data-shaka-player-container style="width:100%; height:100%;">
    <video id="video" autoplay muted playsinline></video>
  </div>
</div>

<script>
const CORS_PROXY = "https://corsproxy.io/?";
const id = new URLSearchParams(location.search).get('id');

async function fetchStreamConfig() {
  try {
    const target = `https://allinonereborn.online/tplay/play.php?id=${id}`;
    const res = await fetch(CORS_PROXY + encodeURIComponent(target));
    const html = await res.text();

    // Extract raw streamConfig text
    let configText = html.match(/const streamConfig\s*=\s*(\{[\s\S]*?\};)/)[1];

    // Manual parsing (more reliable)
    const name = configText.match(/name:\s*["']([^"']+)["']/)[1];
    const mpd = configText.match(/mpd:\s*["']([^"']+)["']/)[1];
    const token = configText.match(/token:\s*["']([^"']+)["']/)[1];
    const referer = configText.match(/referer:\s*["']([^"']+)["']/)[1];
    const userAgent = configText.match(/userAgent:\s*["']([^"']+)["']/)[1];

    const drmMatch = configText.match(/drm:\s*\{([^}]+)\}/);
    let drm = {};
    if (drmMatch) {
      const key = drmMatch[1].match(/["']([^"']+)["']\s*:\s*["']([^"']+)["']/);
      if (key) drm[key[1]] = key[2];
    }

    const streamConfig = { name, mpd, token, referer, userAgent, drm };

    // UI Update
    document.getElementById('chName').textContent = streamConfig.name;
    document.getElementById('title').textContent = streamConfig.name + " — Tata Play";
    document.getElementById('status').style.display = 'none';

    initPlayer(streamConfig);

  } catch (e) {
    console.error(e);
    document.getElementById('status').innerHTML = `❌ Failed to load<br><small>Try again</small>`;
  }
}

function initPlayer(config) {
  shaka.polyfill.installAll();
  const video = document.getElementById('video');
  const container = document.querySelector('[data-shaka-player-container]');

  const player = new shaka.Player(video);
  new shaka.ui.Overlay(player, container, video);

  player.configure({
    drm: { clearKeys: config.drm || {} },
    streaming: { bufferingGoal: 30 }
  });

  player.getNetworkingEngine().registerRequestFilter((type, request) => {
    if (config.referer) request.headers['Referer'] = config.referer;
    if (config.userAgent) request.headers['User-Agent'] = config.userAgent;

    const url = request.uris[0];
    if (url.includes('manifest.mpd') || url.includes('/output/')) {
      const sep = url.includes('?') ? '&' : '?';
      request.uris[0] = url + sep + config.token;
    }
  });

  player.load(config.mpd)
    .then(() => console.log("✅ Stream Started!"))
    .catch(err => {
      console.error(err);
      alert("Stream load failed. Token may be expired.");
    });
}

if (id) fetchStreamConfig();
else document.getElementById('status').textContent = "No Channel ID";
</script>
</body>
