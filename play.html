<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title id="title">Tata Play</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">

  <style>
    body, html { margin:0; padding:0; height:100%; background:#000; overflow:hidden; color:white; font-family:Arial, sans-serif; }
    .player-area { position:fixed; top:0; left:0; width:100vw; height:100dvh; }
    .header {
      position: absolute; top: 15px; left: 15px; z-index: 10000;
      background: rgba(0,0,0,0.8); padding: 12px 16px; border-radius: 12px;
      display: flex; align-items: center; gap: 12px; backdrop-filter: blur(12px);
    }
    .back-btn { font-size: 30px; color: white; text-decoration: none; }
    .loading { text-align:center; margin-top: 40vh; font-size: 18px; }
  </style>
</head>
<body>

<div class="player-area">
  <div class="header">
    <a href="index.html" class="back-btn">←</a>
    <div>
      <strong id="chName">Loading Channel...</strong><br>
      <small id="chInfo">Please wait</small>
    </div>
  </div>

  <div data-shaka-player-container style="width:100%; height:100%;">
    <video id="video" autoplay muted playsinline></video>
  </div>
</div>

<script>
// CORS Proxy
const CORS_PROXY = "https://api.allorigins.win/raw?url=";

const params = new URLSearchParams(location.search);
const id = params.get('id');

if (!id) {
  document.body.innerHTML = `<h2 style="color:red;text-align:center;margin-top:100px">Channel ID missing</h2>`;
}

async function fetchStreamConfig() {
  try {
    document.getElementById('chName').textContent = "Fetching stream...";
    
    const targetUrl = `https://allinonereborn.online/tplay/play.php?id=${id}`;
    const response = await fetch(CORS_PROXY + encodeURIComponent(targetUrl));
    const html = await response.text();

    // Better regex to extract streamConfig
    let match = html.match(/const streamConfig\s*=\s*(\{[\s\S]*?\});/);
    
    if (!match) {
      match = html.match(/streamConfig\s*=\s*(\{[\s\S]*?\});/);
    }

    if (!match) throw new Error("Stream config not found");

    let configStr = match[1];

    // Advanced cleaning for JS object → JSON
    configStr = configStr
      .replace(/(\w+):/g, '"$1":')           // unquoted keys
      .replace(/'/g, '"')                    // single to double quotes
      .replace(/,\s*}/g, '}')                // trailing commas
      .replace(/,\s*([\]}])/g, '$1');        // more trailing comma fixes

    const streamConfig = JSON.parse(configStr);

    // Update UI
    document.getElementById('chName').textContent = streamConfig.name || `Channel ${id}`;
    document.getElementById('title').textContent = (streamConfig.name || 'Live TV') + " — Tata Play";
    document.getElementById('chInfo').textContent = "HD • Live";

    initShakaPlayer(streamConfig);

  } catch (err) {
    console.error(err);
    document.getElementById('chName').innerHTML = `❌ Failed to load<br><small>${err.message}</small>`;
  }
}

function initShakaPlayer(config) {
  shaka.polyfill.installAll();
  const video = document.getElementById('video');
  const container = document.querySelector('[data-shaka-player-container]');

  const player = new shaka.Player(video);
  new shaka.ui.Overlay(player, container, video);

  player.configure({
    drm: { clearKeys: config.drm || {} },
    streaming: { bufferingGoal: 30, rebufferingGoal: 15 }
  });

  player.getNetworkingEngine().registerRequestFilter((type, request) => {
    if (config.referer) request.headers['Referer'] = config.referer;
    if (config.userAgent) request.headers['User-Agent'] = config.userAgent;

    const url = request.uris[0];
    if (url.includes('manifest.mpd') || url.includes('/output/')) {
      const sep = url.includes('?') ? '&' : '?';
      request.uris[0] = url + sep + (config.token || '');
    }
  });

  player.load(config.mpd)
    .then(() => console.log("✅ Stream Loaded"))
    .catch(e => {
      console.error("Load Error:", e);
      alert("Cannot play stream. Token may have expired.");
    });
}

// Start Loading
fetchStreamConfig();
</script>
</body>
</html>
