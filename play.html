<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TP Binge — Live TV</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <!-- Shaka Player v4.7.11 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">

  <style>
    /* ===== DARK THEME ===== */
    :root {
      --header-height: 64px;
      --bg-body: #0d0d18;
      --bg-card: #13131f;
      --bg-card2: #1a1a2e;
      --border: rgba(255,255,255,0.07);
      --accent: #e8534a;
      --accent-2: #3b82f6;
      --text-primary: #f0f0f5;
      --text-secondary: #8888aa;
      --text-muted: #555570;
      --live-red: #e8534a;
      --shadow: 0 8px 32px rgba(0,0,0,0.5);
      --radius: 16px;
      --radius-sm: 10px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg-body); color: var(--text-primary); font-family: 'Outfit', sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    body { background: var(--bg-body); min-height: 100vh; padding-bottom: 32px; }

    /* Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 200;
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: rgba(13,13,24,0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    .logo {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), #ff8a65);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg-card2);
      border: 1px solid var(--border);
      color: var(--text-primary);
      text-decoration: none;
      transition: var(--transition);
      cursor: pointer;
    }
    .back-btn:hover { background: var(--accent); transform: scale(1.05); }
    .back-btn .material-icons-round { font-size: 20px; }

    /* Player Area */
    .player-area {
      width: 100%;
      background: #000;
      position: relative;
    }
    .video-container {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      position: relative;
      overflow: hidden;
    }
    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Info Section */
    .info-section {
      max-width: 100%;
      padding: 0 16px;
    }
    .channel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0 14px;
      gap: 12px;
    }
    .channel-identity {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }
    .channel-logo {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      background: #1a1a2e;
      border: 2px solid var(--border);
      flex-shrink: 0;
    }
    .channel-text h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }
    .channel-text p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 3px;
    }
    .badges {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .badge-live {
      background: var(--live-red);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .badge-live::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      animation: livePulse 1.2s ease-in-out infinite;
    }
    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }
    .badge-hd { background: var(--accent-2); color: #fff; }

    /* Action Buttons */
    .action-row {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .action-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      flex: 1;
      justify-content: center;
    }
    .action-btn .material-icons-round { font-size: 18px; }
    .action-btn:hover {
      background: var(--bg-card2);
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .action-btn.fav-active {
      background: rgba(232,83,74,0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Current Program */
    .current-program {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 4px;
    }
    .program-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .program-time {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 10px;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .progress-track {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #ff8a65);
      border-radius: 2px;
      transition: width 1s linear;
    }
    .description {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .full-desc { display: none; }
    .full-desc.show { display: block; }
    .short-desc.hide { display: none; }
    .desc-toggle {
      display: inline-block;
      color: var(--accent-2);
      font-size: 12px;
      font-weight: 600;
      margin-top: 6px;
      cursor: pointer;
    }

    /* Sections */
    .section-header {
      font-size: 15px;
      font-weight: 700;
      margin: 20px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-header::before {
      content: '';
      width: 3px;
      height: 16px;
      border-radius: 2px;
      background: var(--accent);
    }
    .scroll-row {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 8px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .scroll-row::-webkit-scrollbar { display: none; }
    
    /* Channel Card */
    .channel-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-width: 80px;
      max-width: 80px;
      cursor: pointer;
      flex-shrink: 0;
      text-decoration: none;
    }
    .channel-icon {
      position: relative;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #1a1a2e;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      overflow: hidden;
    }
    .channel-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .channel-icon:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
    }
    .heart-overlay {
      position: absolute;
      bottom: -4px;
      right: -4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--bg-card2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: var(--transition);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .heart-overlay .material-icons-round {
      font-size: 13px;
      color: var(--text-muted);
      transition: var(--transition);
    }
    .heart-overlay.active .material-icons-round {
      color: var(--accent);
    }
    .heart-overlay:active { transform: scale(0.85); }
    .channel-name-sm {
      font-size: 11px;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.3;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .empty-state {
      color: var(--text-muted);
      font-size: 13px;
      padding: 16px 0;
      text-align: center;
    }
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg-card2);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 500;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      white-space: nowrap;
      box-shadow: var(--shadow);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    
    /* Loading shimmer */
    .loading-shimmer {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: linear-gradient(90deg, #1a1a2e 25%, #2a2a3e 50%, #1a1a2e 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>

<header class="app-header">
  <div class="back-btn" onclick="history.back()">
    <span class="material-icons-round">arrow_back</span>
  </div>
  <div class="logo">TP Binge</div>
  <div style="width: 40px;"></div>
</header>

<div class="player-area">
  <div class="video-container" data-shaka-player-container>
    <video autoplay muted playsinline webkit-playsinline data-shaka-player id="video"></video>
  </div>
</div>

<div class="info-section">
  <div class="channel-header">
    <div class="channel-identity">
      <img class="channel-logo" id="channelLogo" src="" alt="logo">
      <div class="channel-text">
        <h1 id="channelName">Loading...</h1>
        <p id="channelGenre">Live TV</p>
      </div>
    </div>
    <div class="badges">
      <span class="badge badge-live">LIVE</span>
      <span class="badge badge-hd">HD</span>
    </div>
  </div>

  <div class="action-row">
    <button class="action-btn" id="favBtn">
      <span class="material-icons-round" id="favIcon">favorite_border</span>
      <span id="favText">Favorite</span>
    </button>
  </div>

  <div class="current-program">
    <div class="program-title" id="programTitle">Currently Airing</div>
    <div class="program-time" id="programTime">--:-- → --:--</div>
    <div class="progress-track"><div class="progress-fill" id="epgProgress" style="width:0%"></div></div>
    <div class="description">
      <span id="shortDesc">Loading program information...</span>
      <span id="fullDesc" class="full-desc"></span>
      <span class="desc-toggle" onclick="toggleDesc()">More info</span>
    </div>
  </div>

  <div class="section-header">📺 Popular Channels</div>
  <div class="scroll-row" id="similarChannelsList"></div>

  <div class="section-header">🕘 Recently Watched</div>
  <div class="scroll-row" id="recentlyWatchedList"></div>
</div>

<div id="toast" class="toast"></div>

<script>
  // ==================== CHANNELS DATABASE WITH REAL LOGOS ====================
  const CHANNELS_DB = [
    { id: "244", name: "Star Bharat HD", logo: "https://ltsk-cdn.s3.eu-west-1.amazonaws.com/jumpstart/Temp_Live/cdn/HLS/Channel/imageContent-6895-j6vqhqnc-v2/imageContent-6895-j6vqhqnc-m2.png", genre: "Entertainment", desc: "Non-stop entertainment, hit shows, dramas, and family favorites. Star Bharat delivers powerful storytelling and vibrant characters." },
    { id: "245", name: "Star Plus HD", logo: "https://ltsk-cdn.s3.eu-west-1.amazonaws.com/jumpstart/Temp_Live/cdn/HLS/Channel/starplus_logo.png", genre: "Drama", desc: "Home to India's favorite dramas and reality shows." },
    { id: "246", name: "Star Gold HD", logo: "https://ltsk-cdn.s3.eu-west-1.amazonaws.com/jumpstart/Temp_Live/cdn/HLS/Channel/stargold_logo.png", genre: "Movies", desc: "Bollywood blockbusters and classic hits 24/7." },
    { id: "247", name: "National Geographic", logo: "https://ltsk-cdn.s3.eu-west-1.amazonaws.com/jumpstart/Temp_Live/cdn/HLS/Channel/natgeo_logo.png", genre: "Documentary", desc: "Explore wildlife, science, and adventure." },
    { id: "248", name: "Star Sports 1", logo: "https://ltsk-cdn.s3.eu-west-1.amazonaws.com/jumpstart/Temp_Live/cdn/HLS/Channel/starsports_logo.png", genre: "Sports", desc: "Live cricket, football, and major sporting events." },
    { id: "249", name: "Colors TV", logo: "https://ltsk-cdn.s3.eu-west-1.amazonaws.com/jumpstart/Temp_Live/cdn/HLS/Channel/colors_logo.png", genre: "Entertainment", desc: "Bold content, award-winning shows, and reality TV." },
    { id: "250", name: "Zee TV", logo: "https://ltsk-cdn.s3.eu-west-1.amazonaws.com/jumpstart/Temp_Live/cdn/HLS/Channel/zeetv_logo.png", genre: "Drama", desc: "Iconic dramas and engaging family entertainment." },
    { id: "251", name: "Sony TV", logo: "https://ltsk-cdn.s3.eu-west-1.amazonaws.com/jumpstart/Temp_Live/cdn/HLS/Channel/sonytv_logo.png", genre: "Entertainment", desc: "Top-rated shows, comedy, and reality programs." },
    { id: "252", name: "MTV India", logo: "https://ltsk-cdn.s3.eu-west-1.amazonaws.com/jumpstart/Temp_Live/cdn/HLS/Channel/mtv_logo.png", genre: "Music", desc: "Music, youth shows, and reality adventures." }
  ];

  // Fallback logo for any channel not found
  const FALLBACK_LOGO = "https://ltsk-cdn.s3.eu-west-1.amazonaws.com/jumpstart/Temp_Live/cdn/HLS/Channel/imageContent-6895-j6vqhqnc-v2/imageContent-6895-j6vqhqnc-m2.png";

  function getChannelInfo(channelId) {
    return CHANNELS_DB.find(c => c.id == channelId) || { 
      id: channelId, 
      name: "Channel", 
      logo: FALLBACK_LOGO, 
      genre: "Live TV",
      desc: "Enjoy live streaming"
    };
  }

  // ==================== STORAGE ====================
  let favorites = JSON.parse(localStorage.getItem('fav_channels') || '[]');
  let recents = JSON.parse(localStorage.getItem('recent_channels') || '[]');

  function saveFavorites() { localStorage.setItem('fav_channels', JSON.stringify(favorites)); }
  function saveRecents() { localStorage.setItem('recent_channels', JSON.stringify(recents.slice(0, 12))); }

  // ==================== SHAKA PLAYER ====================
  let shakaPlayer = null;
  let uiOverlay = null;
  let currentChannelId = null;

  async function fetchAndPlayChannel(channelId) {
    if (!channelId) return;
    currentChannelId = channelId;
    const channelInfo = getChannelInfo(channelId);
    showToast(`Loading ${channelInfo.name}...`);
    
    try {
      const targetUrl = `https://allinonereborn.online/tplay/play.php?id=${channelId}`;
      const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
      const resp = await fetch(proxyUrl);
      const htmlText = await resp.text();
      
      const configMatch = htmlText.match(/const streamConfig\s*=\s*(\{[\s\S]*?\});/);
      if (!configMatch) throw new Error("Stream config not found");
      const configText = configMatch[1];
      
      const nameMatch = configText.match(/name:\s*["']([^"']+)["']/);
      const mpdMatch = configText.match(/mpd:\s*["']([^"']+)["']/);
      const tokenMatch = configText.match(/token:\s*["']([^"']+)["']/);
      const drmMatch = configText.match(/["']([a-fA-F0-9]{32})["']\s*:\s*["']([a-fA-F0-9]{32})["']/);
      const logoMatch = htmlText.match(/const CHANNEL_LOGO\s*=\s*["']([^"']+)["']/);
      const refererMatch = configText.match(/referer:\s*["']([^"']+)["']/);
      const userAgentMatch = configText.match(/userAgent:\s*["']([^"']+)["']/);
      
      const channelName = nameMatch ? nameMatch[1] : channelInfo.name;
      const mpd = mpdMatch ? mpdMatch[1] : "";
      const token = tokenMatch ? tokenMatch[1] : "";
      let drm = {};
      if (drmMatch) drm[drmMatch[1]] = drmMatch[2];
      const channelLogo = (logoMatch ? logoMatch[1] : channelInfo.logo) || FALLBACK_LOGO;
      const referer = refererMatch ? refererMatch[1] : "https://www.tataplaybinge.com/";
      const userAgent = userAgentMatch ? userAgentMatch[1] : "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36";
      
      // Update UI
      document.title = `${channelName} | TP Binge`;
      document.getElementById('channelName').innerText = channelName;
      document.getElementById('channelLogo').src = channelLogo;
      document.getElementById('channelGenre').innerText = channelInfo.genre;
      document.getElementById('shortDesc').innerText = channelInfo.desc;
      document.getElementById('fullDesc').innerText = channelInfo.desc + " Watch epic entertainment, dramas, and more only on TP Binge.";
      
      updateFavoriteButtonUI(channelId);
      addToRecentlyWatched(channelId, channelName, channelLogo);
      renderRecentlyWatched();
      renderSimilarChannels();
      
      initShakaPlayer(mpd, token, drm, referer, userAgent);
      
      setTimeout(() => { const vid = document.getElementById('video'); if(vid) vid.play().catch(e => console.log("autoplay", e)); }, 500);
      
    } catch (err) {
      console.error(err);
      showToast("Failed to load stream. Try another channel.");
    }
  }

  function initShakaPlayer(mpdUrl, token, drmKeys, referer, userAgent) {
    const videoEl = document.getElementById('video');
    const container = document.querySelector('[data-shaka-player-container]');
    
    if (shakaPlayer) {
      shakaPlayer.destroy();
      shakaPlayer = null;
    }
    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) {
      alert("Browser not supported");
      return;
    }
    shakaPlayer = new shaka.Player(videoEl);
    if (uiOverlay) uiOverlay.destroy();
    uiOverlay = new shaka.ui.Overlay(shakaPlayer, container, videoEl);
    uiOverlay.configure({
      controlPanelElements: ['play_pause', 'time_and_duration', 'spacer', 'mute', 'fullscreen', 'quality', 'overflow_menu'],
      overflowMenuButtons: ['captions', 'playback_rate'],
      seekBarColors: { base: 'rgba(255,255,255,0.2)', buffered: 'rgba(255,255,255,0.4)', played: '#e8534a' }
    });
    
    if (drmKeys && Object.keys(drmKeys).length) {
      shakaPlayer.configure({ drm: { clearKeys: drmKeys } });
    }
    
    shakaPlayer.getNetworkingEngine().clearAllRequestFilters();
    shakaPlayer.getNetworkingEngine().registerRequestFilter((type, request) => {
      if (referer) request.headers['Referer'] = referer;
      if (userAgent) request.headers['User-Agent'] = userAgent;
      if (token && (type === shaka.net.NetworkingEngine.RequestType.MANIFEST || type === shaka.net.NetworkingEngine.RequestType.SEGMENT)) {
        if (!request.uris[0].includes('__hdnea')) {
          const separator = request.uris[0].includes('?') ? '&' : '?';
          request.uris[0] += separator + token;
        }
      }
    });
    
    shakaPlayer.load(mpdUrl).catch(e => { console.error(e); showToast("Playback error"); });
  }

  // ==================== FAVORITES ====================
  function updateFavoriteButtonUI(channelId) {
    const isFav = favorites.includes(channelId);
    const favIcon = document.getElementById('favIcon');
    const favText = document.getElementById('favText');
    if (isFav) {
      favIcon.innerText = 'favorite';
      favText.innerText = 'Favorited';
      document.getElementById('favBtn').classList.add('fav-active');
    } else {
      favIcon.innerText = 'favorite_border';
      favText.innerText = 'Favorite';
      document.getElementById('favBtn').classList.remove('fav-active');
    }
  }
  
  function toggleFavorite() {
    if (!currentChannelId) return;
    const idx = favorites.indexOf(currentChannelId);
    if (idx === -1) {
      favorites.push(currentChannelId);
      showToast("Added to favorites");
    } else {
      favorites.splice(idx, 1);
      showToast("Removed from favorites");
    }
    saveFavorites();
    updateFavoriteButtonUI(currentChannelId);
    renderSimilarChannels();
  }
  
  function toggleFavoriteById(chId, event) {
    if (event) event.stopPropagation();
    const idx = favorites.indexOf(chId);
    if (idx === -1) favorites.push(chId);
    else favorites.splice(idx, 1);
    saveFavorites();
    renderSimilarChannels();
    if (currentChannelId === chId) updateFavoriteButtonUI(chId);
    showToast(idx === -1 ? "Added to favorites" : "Removed from favorites");
  }
  
  // ==================== RECENTLY WATCHED ====================
  function addToRecentlyWatched(id, name, logo) {
    recents = recents.filter(cid => cid !== id);
    recents.unshift(id);
    if (recents.length > 15) recents.pop();
    saveRecents();
  }
  
  function renderRecentlyWatched() {
    const container = document.getElementById('recentlyWatchedList');
    if (!container) return;
    const recentIds = recents.filter(rid => rid != currentChannelId);
    if (recentIds.length === 0) {
      container.innerHTML = '<div class="empty-state">No recently watched channels</div>';
      return;
    }
    let html = '';
    for (let rid of recentIds.slice(0, 12)) {
      const ch = getChannelInfo(rid);
      html += `
        <div class="channel-card" onclick="navigateToChannel('${ch.id}')">
          <div class="channel-icon">
            <img src="${ch.logo}" loading="lazy" onerror="this.src='${FALLBACK_LOGO}'">
          </div>
          <span class="channel-name-sm">${ch.name}</span>
        </div>
      `;
    }
    container.innerHTML = html;
  }
  
  // ==================== SIMILAR / POPULAR CHANNELS ====================
  function renderSimilarChannels() {
    const container = document.getElementById('similarChannelsList');
    if (!container) return;
    let similar = CHANNELS_DB.filter(c => c.id != currentChannelId);
    if (similar.length === 0) {
      container.innerHTML = '<div class="empty-state">No recommendations available</div>';
      return;
    }
    let html = '';
    for (let ch of similar.slice(0, 10)) {
      const isFav = favorites.includes(ch.id);
      html += `
        <div class="channel-card" onclick="navigateToChannel('${ch.id}')">
          <div class="channel-icon">
            <img src="${ch.logo}" loading="lazy" onerror="this.src='${FALLBACK_LOGO}'">
            <div class="heart-overlay ${isFav ? 'active' : ''}" onclick="toggleFavoriteById('${ch.id}', event)">
              <span class="material-icons-round">${isFav ? 'favorite' : 'favorite_border'}</span>
            </div>
          </div>
          <span class="channel-name-sm">${ch.name}</span>
        </div>
      `;
    }
    container.innerHTML = html;
  }
  
  function navigateToChannel(chId) {
    if (chId == currentChannelId) return;
    fetchAndPlayChannel(chId);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  
  // ==================== EPG PROGRESS MOCK ====================
  function updateProgress() {
    const now = new Date();
    const startHour = 6, endHour = 24;
    const start = new Date(); start.setHours(startHour, 0, 0, 0);
    let end = new Date(); end.setHours(endHour, 0, 0, 0);
    if (now < start) document.getElementById('epgProgress').style.width = '0%';
    else if (now > end) document.getElementById('epgProgress').style.width = '100%';
    else {
      const total = end - start;
      const elapsed = now - start;
      const pct = (elapsed / total) * 100;
      document.getElementById('epgProgress').style.width = pct + '%';
    }
    document.getElementById('programTime').innerText = `${startHour.toString().padStart(2, '0')}:00 → ${endHour.toString().padStart(2, '0')}:00`;
  }
  setInterval(updateProgress, 5000);
  updateProgress();
  
  // ==================== UTILITIES ====================
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }
  
  window.toggleDesc = function() {
    const short = document.getElementById('shortDesc');
    const full = document.getElementById('fullDesc');
    const btn = document.querySelector('.desc-toggle');
    if (short.classList.contains('hide')) {
      short.classList.remove('hide');
      full.classList.remove('show');
      btn.textContent = 'More info';
    } else {
      short.classList.add('hide');
      full.classList.add('show');
      btn.textContent = 'Show less';
    }
  };
  
  // ==================== INIT ====================
  document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    let channelId = urlParams.get('id');
    if (!channelId) channelId = "244";
    
    document.getElementById('favBtn').addEventListener('click', toggleFavorite);
    
    fetchAndPlayChannel(channelId);
    
    const videoEl = document.getElementById('video');
    if (videoEl) {
      videoEl.muted = true;
      document.body.addEventListener('touchstart', () => {
        if (videoEl.muted) videoEl.muted = false;
        videoEl.play().catch(() => {});
      }, { once: true });
    }
  });
  
  window.navigateToChannel = navigateToChannel;
  window.toggleFavoriteById = toggleFavoriteById;
</script>
</body>
</html>
