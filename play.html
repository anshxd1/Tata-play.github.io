<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
viewport-fit=cover,
user-scalable=no">

<title id="title">Tata Play</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://fonts.googleapis.com/icon?family=Material+Icons+Round">

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">

<style>

/* ===== CSS VARIABLES ===== */

:root{

--header-height:64px;

--bg-body:#0d0d18;
--bg-card:#13131f;
--bg-card2:#1a1a2e;

--border:rgba(255,255,255,.07);

--accent:#e8534a;
--accent-2:#3b82f6;

--text-primary:#f0f0f5;
--text-secondary:#8888aa;
--text-muted:#555570;

--radius:16px;
--radius-sm:10px;

--transition:all .25s cubic-bezier(.4,0,.2,1);

}

/* ===== RESET ===== */

*,
*::before,
*::after{

margin:0;
padding:0;

box-sizing:border-box;

-webkit-tap-highlight-color:transparent;

}

html,
body{

width:100%;
height:100%;

overflow:hidden !important;

background:#000 !important;

font-family:'Outfit',sans-serif;

}

/* ========================================
FULLSCREEN PLAYER AREA
======================================== */

.player-area{

position:fixed !important;

top:0;
left:0;

width:100vw;
height:100dvh;

background:#000 !important;

overflow:hidden;

}

/* ========================================
HEADER
======================================== */

.app-header{

position:absolute;

top:max(env(safe-area-inset-top),12px);

left:12px;
right:12px;

z-index:999999;

height:58px;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 14px;

border-radius:18px;

background:rgba(13,13,24,.78);

backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.05);

transition:opacity .3s ease;

}

/* ========================================
LEFT AREA
======================================== */

.header-left{

display:flex;
align-items:center;
gap:12px;

min-width:0;

}

/* ========================================
BACK BUTTON
======================================== */

.back-btn{

display:flex;
align-items:center;
justify-content:center;

width:40px;
height:40px;

border-radius:50%;

background:var(--bg-card2);

border:1px solid var(--border);

color:#fff;

text-decoration:none;

flex-shrink:0;

transition:var(--transition);

}

.back-btn:hover{

background:var(--accent);

transform:scale(1.05);

}

.back-btn .material-icons-round{

font-size:20px;

}

/* ========================================
CHANNEL INFO
======================================== */

.channel-meta{

min-width:0;

}

.channel-meta h1{

font-size:15px;
font-weight:700;

color:var(--text-primary);

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

max-width:180px;

}

.channel-meta p{

font-size:12px;

color:var(--text-secondary);

margin-top:2px;

}

/* ========================================
LIVE BADGE
======================================== */

.live-badge{

display:flex;
align-items:center;
gap:6px;

padding:6px 10px;

border-radius:20px;

background:#e8534a;

color:#fff;

font-size:11px;
font-weight:700;

flex-shrink:0;

}

.live-dot{

width:7px;
height:7px;

border-radius:50%;

background:#fff;

animation:pulse 1.2s infinite;

}

@keyframes pulse{

0%,100%{
opacity:1;
transform:scale(1);
}

50%{
opacity:.4;
transform:scale(.7);
}

}

/* ========================================
VIDEO AREA
======================================== */

.video-container{

position:absolute !important;

top:0;
left:0;

width:100vw !important;
height:100dvh !important;

background:#000 !important;

display:flex;
align-items:center;
justify-content:center;

overflow:hidden !important;

}

/* ========================================
SHAKA FIX
======================================== */

.shaka-video-container{

position:absolute !important;

top:0;
left:0;

width:100% !important;
height:100% !important;

background:#000 !important;

overflow:hidden !important;

display:flex !important;
align-items:center !important;
justify-content:center !important;

}

/* ========================================
VIDEO FIX
======================================== */

video{

position:absolute !important;

top:50% !important;
left:50% !important;

transform:translate(-50%,-50%) !important;

width:100vw !important;
height:100dvh !important;

max-width:100vw !important;
max-height:100dvh !important;

object-fit:contain !important;

background:#000 !important;

}

/* ========================================
PREVENT HALF SCREEN BUG
======================================== */

.shaka-video-container video{

width:100vw !important;
height:100dvh !important;

object-fit:contain !important;

}

/* ========================================
CONTROLS FIX
======================================== */

.shaka-controls-container{

z-index:999999 !important;

bottom:0 !important;

width:100% !important;

padding-bottom:
max(env(safe-area-inset-bottom),8px) !important;

}

/* ========================================
BOTTOM BAR FIX
======================================== */

.shaka-bottom-controls{

width:100% !important;

padding-left:10px !important;
padding-right:10px !important;

box-sizing:border-box !important;

}

/* ========================================
OVERFLOW FIX
======================================== */

.shaka-overflow-menu{

max-height:70vh !important;

overflow-y:auto !important;

}

/* ========================================
STATUS
======================================== */

.status{

position:absolute;

top:50%;
left:50%;

transform:translate(-50%,-50%);

z-index:999999;

padding:18px 24px;

border-radius:16px;

background:rgba(0,0,0,.82);

backdrop-filter:blur(12px);

color:#fff;

font-size:14px;
text-align:center;

}

/* ========================================
LANDSCAPE FIX
======================================== */

@media screen and (orientation:landscape){

html,
body,
.player-area{

width:100vw !important;
height:100vh !important;

overflow:hidden !important;

}

video{

width:100vw !important;
height:100vh !important;

object-fit:contain !important;

}

}

/* ========================================
SMALL DEVICE FIX
======================================== */

@media(max-width:480px){

.channel-meta h1{

max-width:120px;

font-size:14px;

}

.app-header{

height:54px;

padding:0 10px;

}

}

</style>

</head>

<body>

<div class="player-area">

<!-- HEADER -->

<header class="app-header" id="header">

<div class="header-left">

<a href="index.html"
class="back-btn">

<span class="material-icons-round">
arrow_back
</span>

</a>

<div class="channel-meta">

<h1 id="chName">
Loading Channel...
</h1>

<p id="chInfo">
Tata Play
</p>

</div>

</div>

<div class="live-badge">

<div class="live-dot"></div>

LIVE

</div>

</header>

<!-- STATUS -->

<div class="status"
id="status">

Connecting...

</div>

<!-- PLAYER -->

<div
class="video-container"
data-shaka-player-container>

<video
id="video"
autoplay
playsinline
webkit-playsinline>
</video>

</div>

</div>

<script>

const CORS_PROXY =
"https://corsproxy.io/?";

const id =
new URLSearchParams(location.search)
.get("id");

/* ========================================
FETCH CONFIG
======================================== */

async function fetchStreamConfig(){

try{

const target =
`https://allinonereborn.online/tplay/play.php?id=${id}`;

const res =
await fetch(
CORS_PROXY + encodeURIComponent(target)
);

const html =
await res.text();

const configText =
html.match(
/const streamConfig\s*=\s*(\{[\s\S]*?\};)/
)[1];

const name =
configText.match(
/name:\s*["']([^"']+)["']/
)[1];

const mpd =
configText.match(
/mpd:\s*["']([^"']+)["']/
)[1];

const token =
configText.match(
/token:\s*["']([^"']+)["']/
)[1];

const referer =
configText.match(
/referer:\s*["']([^"']+)["']/
)[1];

const userAgent =
configText.match(
/userAgent:\s*["']([^"']+)["']/
)[1];

const drmMatch =
configText.match(
/drm:\s*\{([^}]+)\}/
);

let drm = {};

if(drmMatch){

const key =
drmMatch[1].match(
/["']([^"']+)["']\s*:\s*["']([^"']+)["']/
);

if(key){

drm[key[1]] = key[2];

}

}

const streamConfig = {

name,
mpd,
token,
referer,
userAgent,
drm

};

document.getElementById("chName")
.textContent = streamConfig.name;

document.getElementById("title")
.textContent =
streamConfig.name + " — Tata Play";

document.getElementById("status")
.style.display = "none";

initPlayer(streamConfig);

}catch(e){

console.error(e);

document.getElementById("status")
.innerHTML =
`❌ Failed to load<br><small>Try again</small>`;

}

}

/* ========================================
INIT PLAYER
======================================== */

function initPlayer(config){

shaka.polyfill.installAll();

if(!shaka.Player.isBrowserSupported()){

alert("Browser not supported");

return;

}

const video =
document.getElementById("video");

const container =
document.querySelector(
"[data-shaka-player-container]"
);

const player =
new shaka.Player(video);

const ui =
new shaka.ui.Overlay(
player,
container,
video
);

ui.configure({

controlPanelElements:[

'play_pause',
'time_and_duration',
'spacer',
'mute',
'volume',
'fullscreen',
'overflow_menu'

],

overflowMenuButtons:[

'quality',
'language',
'playback_rate'

]

});

player.configure({

drm:{
clearKeys: config.drm || {}
},

streaming:{
bufferingGoal:30,
rebufferingGoal:15
}

});

player.getNetworkingEngine()
.registerRequestFilter((type,request)=>{

if(config.referer){

request.headers['Referer'] =
config.referer;

}

if(config.userAgent){

request.headers['User-Agent'] =
config.userAgent;

}

const url =
request.uris[0];

if(
(url.includes('manifest.mpd')
||
url.includes('/output/'))
&&
config.token
){

const sep =
url.includes('?')
?
'&'
:
'?';

request.uris[0] =
url + sep + config.token;

}

});

player.load(config.mpd)

.then(async()=>{

try{

await video.play();

console.log("✅ Stream Started");

}catch(e){

console.log(e);

}

})

.catch(err=>{

console.error(err);

alert(
"Stream load failed.\nToken expired."
);

});

}

/* ========================================
AUTO HIDE HEADER
======================================== */

let hideTimer;

function showHeader(){

const header =
document.getElementById("header");

header.style.opacity = "1";

clearTimeout(hideTimer);

hideTimer =
setTimeout(()=>{

header.style.opacity = "0";

},4000);

}

document.addEventListener(
"mousemove",
showHeader
);

document.addEventListener(
"touchstart",
showHeader
);

showHeader();

/* ========================================
START
======================================== */

if(id){

fetchStreamConfig();

}else{

document.getElementById("status")
.textContent =
"No Channel ID";

}

</script>

</body>
</html>
