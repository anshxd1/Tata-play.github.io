
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
viewport-fit=cover,
user-scalable=no">

<title id="title">Tata Play</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">

<style>

/* =========================
RESET
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Arial,sans-serif;
}

/* =========================
ROOT PLAYER AREA
========================= */

.player-area{
position:fixed;
inset:0;
width:100vw;
height:100dvh;
background:#000;
overflow:hidden;
}

/* =========================
VIDEO CONTAINER
========================= */

.video-wrapper{
position:absolute;
inset:0;
width:100%;
height:100%;
background:#000;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
}

/* =========================
SHAKA CONTAINER
========================= */

.shaka-video-container{
width:100% !important;
height:100% !important;
background:#000 !important;
display:flex !important;
align-items:center !important;
justify-content:center !important;
overflow:hidden !important;
}

/* =========================
VIDEO FIXES
========================= */

video{
width:100% !important;
height:100% !important;
object-fit:contain !important;
background:#000 !important;
outline:none;
border:none;
}

/* =========================
PREVENT STRETCH BUG
========================= */

video::-webkit-media-controls{
display:none !important;
}

/* =========================
HEADER
========================= */

.header{
position:absolute;
top:max(env(safe-area-inset-top),12px);
left:12px;
right:12px;
z-index:99999;

display:flex;
align-items:center;
gap:12px;

padding:12px 14px;

background:rgba(0,0,0,0.72);

backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);

border-radius:16px;

transition:opacity .3s ease;
}

.back-btn{
width:42px;
height:42px;

display:flex;
align-items:center;
justify-content:center;

border-radius:50%;

background:rgba(255,255,255,0.08);

color:#fff;
text-decoration:none;

font-size:24px;
font-weight:bold;

flex-shrink:0;
}

.channel-meta{
overflow:hidden;
}

.channel-meta strong{
display:block;
font-size:15px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.channel-meta small{
opacity:.7;
font-size:12px;
}

/* =========================
STATUS BOX
========================= */

.status{
position:absolute;
top:50%;
left:50%;

transform:translate(-50%,-50%);

z-index:9999;

background:rgba(0,0,0,.82);

padding:22px 28px;

border-radius:18px;

font-size:15px;
text-align:center;

backdrop-filter:blur(12px);

min-width:220px;
}

/* =========================
SHAKA CONTROLS FIX
========================= */

.shaka-controls-container{
padding-bottom:max(env(safe-area-inset-bottom),8px) !important;
z-index:999999 !important;
}

.shaka-bottom-controls{
padding-left:8px !important;
padding-right:8px !important;
box-sizing:border-box !important;
}

/* =========================
OVERFLOW MENU FIX
========================= */

.shaka-overflow-menu{
max-height:65vh !important;
overflow-y:auto !important;
}

/* =========================
FULLSCREEN FIX
========================= */

.player-area:fullscreen{
width:100vw;
height:100vh;
background:#000;
}

.player-area:-webkit-full-screen{
width:100vw;
height:100vh;
background:#000;
}

/* =========================
LANDSCAPE MOBILE FIX
========================= */

@media (orientation:landscape){

.header{
top:10px;
left:10px;
right:auto;
max-width:320px;
}

}

/* =========================
SMALL DEVICE FIX
========================= */

@media (max-width:480px){

.header{
padding:10px 12px;
gap:10px;
}

.back-btn{
width:38px;
height:38px;
font-size:22px;
}

.channel-meta strong{
font-size:14px;
}

.channel-meta small{
font-size:11px;
}

.status{
width:85%;
font-size:14px;
}

}

</style>
</head>

<body>

<div class="player-area" id="playerArea">

<div class="header" id="header">
<a href="index.html" class="back-btn">←</a>

<div class="channel-meta">
<strong id="chName">Loading Channel...</strong>
<small id="chInfo">Tata Play</small>
</div>
</div>

<div class="status" id="status">
Connecting...
</div>

<div class="video-wrapper">
<div data-shaka-player-container
class="video-container"
style="width:100%;height:100%;">

<video
id="video"
autoplay
muted
playsinline
webkit-playsinline
></video>

</div>
</div>

</div>

<script>

const CORS_PROXY = "https://corsproxy.io/?";

const id = new URLSearchParams(location.search).get('id');

/* =========================
FETCH STREAM CONFIG
========================= */

async function fetchStreamConfig(){

try{

const target =
`https://allinonereborn.online/tplay/play.php?id=${id}`;

const res =
await fetch(
CORS_PROXY + encodeURIComponent(target)
);

const html = await res.text();

let configText =
html.match(
/const streamConfig\s*=\s*(\{[\s\S]*?\};)/
)[1];

const name =
configText.match(/name:\s*["']([^"']+)["']/)[1];

const mpd =
configText.match(/mpd:\s*["']([^"']+)["']/)[1];

const token =
configText.match(/token:\s*["']([^"']+)["']/)[1];

const referer =
configText.match(/referer:\s*["']([^"']+)["']/)[1];

const userAgent =
configText.match(/userAgent:\s*["']([^"']+)["']/)[1];

const drmMatch =
configText.match(/drm:\s*\{([^}]+)\}/);

let drm = {};

if(drmMatch){

const key =
drmMatch[1].match(
/["']([^"']+)["']\s*:\s*["']([^"']+)["']/
);

if(key){
drm[key[1]] = key[2];
}

}

const streamConfig = {
name,
mpd,
token,
referer,
userAgent,
drm
};

document.getElementById('chName').textContent =
streamConfig.name;

document.getElementById('title').textContent =
streamConfig.name + " — Tata Play";

document.getElementById('status').style.display =
'none';

initPlayer(streamConfig);

}catch(e){

console.error(e);

document.getElementById('status').innerHTML =
`❌ Failed to load<br><small>Try again</small>`;

}

}

/* =========================
PLAYER INIT
========================= */

function initPlayer(config){

shaka.polyfill.installAll();

if(!shaka.Player.isBrowserSupported()){

alert("Browser not supported");

return;

}

const video =
document.getElementById('video');

const container =
document.querySelector(
'[data-shaka-player-container]'
);

const player =
new shaka.Player(video);

const ui =
new shaka.ui.Overlay(
player,
container,
video
);

ui.configure({

controlPanelElements:[
'play_pause',
'time_and_duration',
'spacer',
'mute',
'volume',
'fullscreen',
'overflow_menu'
],

overflowMenuButtons:[
'quality',
'language',
'playback_rate'
]

});

player.configure({

drm:{
clearKeys: config.drm || {}
},

streaming:{
bufferingGoal:30,
rebufferingGoal:15
}

});

player.getNetworkingEngine()
.registerRequestFilter((type,request)=>{

if(config.referer){
request.headers['Referer'] =
config.referer;
}

if(config.userAgent){
request.headers['User-Agent'] =
config.userAgent;
}

const url = request.uris[0];

if(
(url.includes('manifest.mpd') ||
url.includes('/output/'))
&& config.token
){

const sep =
url.includes('?') ? '&' : '?';

request.uris[0] =
url + sep + config.token;

}

});

player.load(config.mpd)

.then(async ()=>{

console.log("✅ Stream Started!");

try{

video.muted = false;

await video.play();

}catch(e){

console.log(e);

}

})

.catch(err=>{

console.error(err);

alert(
"Stream load failed.\nToken may be expired."
);

});

}

/* =========================
AUTO HEADER HIDE
========================= */

let hideTimer;

function showHeader(){

const header =
document.getElementById("header");

header.style.opacity = "1";

clearTimeout(hideTimer);

hideTimer = setTimeout(()=>{

header.style.opacity = "0";

},4000);

}

document.addEventListener(
"mousemove",
showHeader
);

document.addEventListener(
"touchstart",
showHeader
);

showHeader();

/* =========================
START
========================= */

if(id){

fetchStreamConfig();

}else{

document.getElementById('status')
.textContent = "No Channel ID";

}

</script>

</body>
</html>
