<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover"
/>

<title>Tata Play</title>

<!-- SHAKA CORE -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.min.js"></script>

<!-- SHAKA UI -->
<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/controls.min.css"
/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.ui.min.js"></script>

<style>

/* =========================
RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:sans-serif;
}

/* =========================
APP
========================= */

.app{
  width:100%;
  height:100vh;
  background:#000;
  position:relative;
}

/* =========================
HEADER
========================= */

.header{

  position:fixed;

  top:0;
  left:0;

  width:100%;
  height:64px;

  display:flex;
  align-items:center;
  gap:14px;

  padding:0 16px;

  background:rgba(0,0,0,.72);

  backdrop-filter:blur(10px);

  z-index:9999;

  border-bottom:
  1px solid rgba(255,255,255,.08);

}

.back-btn{

  width:42px;
  height:42px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  text-decoration:none;

  color:#fff;

  font-size:20px;

  background:rgba(255,255,255,.08);

}

.channel-info{

  display:flex;
  align-items:center;
  gap:12px;

}

.channel-logo{

  width:42px;
  height:42px;

  border-radius:50%;

  object-fit:cover;

  background:#fff;

}

.channel-meta h1{

  color:#fff;
  font-size:16px;

}

.channel-meta p{

  color:#aaa;
  font-size:12px;

}

/* =========================
PLAYER
========================= */

.player-container{

  position:absolute;

  top:64px;
  left:0;

  width:100%;
  height:calc(100vh - 64px);

  background:#000;

}

.shaka-video-container{

  width:100% !important;
  height:100% !important;

  background:#000 !important;

}

video{

  width:100% !important;
  height:100% !important;

  object-fit:contain !important;

  background:#000 !important;

}

/* =========================
FIX CONTROLS
========================= */

.shaka-controls-container{

  opacity:1 !important;
  visibility:visible !important;

}

.shaka-bottom-controls{

  display:flex !important;

}

.shaka-seek-bar-container{

  display:flex !important;

}

.shaka-fullscreen-button{

  display:flex !important;

}

.shaka-current-time,
.shaka-time-duration{

  display:block !important;

}

.shaka-small-play-button{

  display:none !important;

}

/* =========================
STATUS
========================= */

.status{

  position:absolute;

  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  color:#fff;

  z-index:99999;

  background:rgba(0,0,0,.75);

  padding:14px 20px;

  border-radius:12px;

}

/* =========================
FULLSCREEN
========================= */

video:fullscreen,
.shaka-video-container:fullscreen{

  width:100vw !important;
  height:100vh !important;

}

video:-webkit-full-screen,
.shaka-video-container:-webkit-full-screen{

  width:100vw !important;
  height:100vh !important;

}

/* =========================
MOBILE
========================= */

@media(max-width:768px){

  .player-container{

    height:calc(100dvh - 64px);

  }

}

</style>

</head>
<body>

<div class="app">

<!-- HEADER -->

<header class="header">

<a
href="index.html"
class="back-btn"
>
←
</a>

<div class="channel-info">

<img
id="channelLogo"
class="channel-logo"
src=""
alt=""
>

<div class="channel-meta">

<h1 id="channelName">
Loading...
</h1>

<p>
Tata Play
</p>

</div>

</div>

</header>

<!-- PLAYER -->

<div
class="player-container"
data-shaka-player-container
>

<video
id="video"
autoplay
playsinline
webkit-playsinline
muted
></video>

</div>

<!-- STATUS -->

<div
id="status"
class="status"
>
Loading stream...
</div>

</div>

<script>

/* =========================
GET CHANNEL ID
========================= */

const id =
new URLSearchParams(
location.search
).get("id");

/* =========================
FETCH STREAM CONFIG
========================= */

async function getConfig(){

try{

const target =
`https://allinonereborn.online/tplay/play.php?id=${id}`;

const proxy =
`https://corsproxy.io/?${encodeURIComponent(target)}`;

const res =
await fetch(proxy);

const html =
await res.text();

/* =========================
GET STREAM CONFIG
========================= */

const configMatch =
html.match(
/const streamConfig\s*=\s*(\{[\s\S]*?\});/
);

if(!configMatch){

throw new Error(
"Config not found"
);

}

const configText =
configMatch[1];

const name =
configText.match(
/name:\s*["']([^"']+)["']/
)?.[1] || "Channel";

const mpd =
configText.match(
/mpd:\s*["']([^"']+)["']/
)?.[1] || "";

const token =
configText.match(
/token:\s*["']([^"']+)["']/
)?.[1] || "";

const drmKey =
configText.match(
/["']([a-zA-Z0-9]+)["']\s*:\s*["']([a-zA-Z0-9]+)["']/
);

let drm = {};

if(drmKey){

drm[drmKey[1]] =
drmKey[2];

}

/* =========================
LOGO
========================= */

const logo =
html.match(
/const CHANNEL_LOGO = ["']([^"']+)["']/
)?.[1] || "";

/* =========================
UPDATE UI
========================= */

document.title = name;

document.getElementById(
"channelName"
).innerText = name;

document.getElementById(
"channelLogo"
).src = logo;

document.getElementById(
"status"
).style.display = "none";

/* =========================
START PLAYER
========================= */

startPlayer({
mpd,
token,
drm
});

}catch(err){

console.error(err);

document.getElementById(
"status"
).innerHTML =
"❌ Failed to load stream";

}

}

/* =========================
START PLAYER
========================= */

async function startPlayer(config){

shaka.polyfill.installAll();

if(
!shaka.Player.isBrowserSupported()
){

alert(
"Browser not supported"
);

return;

}

const video =
document.getElementById(
"video"
);

const container =
document.querySelector(
".player-container"
);

/* =========================
PLAYER
========================= */

const player =
new shaka.Player(video);

/* =========================
UI
========================= */

const ui =
new shaka.ui.Overlay(
player,
container,
video
);

ui.configure({

controlPanelElements:[

'play_pause',

'time_and_duration',

'spacer',

'mute',

'volume',

'fullscreen'

]

});

/* =========================
DRM
========================= */

player.configure({

drm:{
clearKeys:config.drm
}

});

/* =========================
TOKEN
========================= */

player
.getNetworkingEngine()
.registerRequestFilter(
(type,request)=>{

if(
(
type ===
shaka.net.NetworkingEngine.RequestType.MANIFEST
||
type ===
shaka.net.NetworkingEngine.RequestType.SEGMENT
)
&&
config.token
){

if(
!request.uris[0]
.includes("__hdnea")
){

const sep =
request.uris[0]
.includes("?")
?
"&"
:
"?";

request.uris[0] +=
sep + config.token;

}

}

}
);

/* =========================
LOAD STREAM
========================= */

try{

await player.load(
config.mpd
);

await video.play();

}catch(err){

console.error(err);

document.getElementById(
"status"
).style.display = "block";

document.getElementById(
"status"
).innerHTML =
"❌ Stream failed";

}

}

/* =========================
START
========================= */

if(id){

getConfig();

}else{

document.getElementById(
"status"
).innerHTML =
"No Channel ID";

}

</script>

</body>
</html>
