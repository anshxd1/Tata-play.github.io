<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title id="title">Tata Play</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">

  <style>
    body, html { margin:0; padding:0; height:100%; background:#000; overflow:hidden; color:white; font-family:Arial, sans-serif; }
    .player-area { position:fixed; top:0; left:0; width:100vw; height:100dvh; }
    .header {
      position: absolute; top: 15px; left: 15px; z-index: 10000;
      background: rgba(0,0,0,0.75); padding: 10px 15px; border-radius: 10px;
      display: flex; align-items: center; gap: 12px; backdrop-filter: blur(10px);
    }
    .back-btn { font-size: 28px; color: white; text-decoration: none; }
    .error { color: #ff6b6b; text-align: center; padding: 20px; }
  </style>
</head>
<body>

<div class="player-area">
  <div class="header">
    <a href="index.html" class="back-btn">←</a>
    <div>
      <strong id="chName">Loading Channel...</strong><br>
      <small id="chInfo">Tata Play</small>
    </div>
  </div>

  <div data-shaka-player-container style="width:100%; height:100%;">
    <video id="video" autoplay muted playsinline></video>
  </div>
</div>

<script>
// Free public CORS proxy (allorigins.win)
const CORS_PROXY = "https://api.allorigins.win/raw?url=";

const params = new URLSearchParams(location.search);
const id = params.get('id');

if (!id) {
  document.body.innerHTML = `<h2 class="error">❌ Channel ID missing</h2>`;
}

async function fetchStreamConfig() {
  try {
    const targetUrl = `https://allinonereborn.online/tplay/play.php?id=${id}`;
    const response = await fetch(CORS_PROXY + encodeURIComponent(targetUrl));
    
    if (!response.ok) throw new Error("Failed to fetch");

    const html = await response.text();

    // Extract streamConfig
    const match = html.match(/const streamConfig\s*=\s*(\{[\s\S]*?\});/);
    
    if (!match) throw new Error("Config not found in response");

    let configStr = match[1]
      .replace(/(\w+):/g, '"$1":')           // keys ko quote karo
      .replace(/'/g, '"');                   // single quotes ko double mein

    const streamConfig = JSON.parse(configStr);

    // UI Update
    document.getElementById('chName').textContent = streamConfig.name || `Channel ${id}`;
    document.getElementById('title').textContent = `${streamConfig.name || 'Live'} — Tata Play`;
    document.getElementById('chInfo').textContent = "HD Live";

    initShakaPlayer(streamConfig);

  } catch (err) {
    console.error(err);
    document.getElementById('chName').innerHTML = `❌ Error loading channel<br><small>${err.message}</small>`;
  }
}

function initShakaPlayer(config) {
  shaka.polyfill.installAll();
  const video = document.getElementById('video');
  const container = document.querySelector('[data-shaka-player-container]');

  const player = new shaka.Player(video);
  new shaka.ui.Overlay(player, container, video);

  player.configure({
    drm: { clearKeys: config.drm || {} },
    streaming: { bufferingGoal: 30 }
  });

  player.getNetworkingEngine().registerRequestFilter((type, request) => {
    if (config.referer) request.headers['Referer'] = config.referer;
    if (config.userAgent) request.headers['User-Agent'] = config.userAgent;

    if (request.uris[0].includes('manifest.mpd') || request.uris[0].includes('/output/')) {
      const sep = request.uris[0].includes('?') ? '&' : '?';
      request.uris[0] += sep + (config.token || '');
    }
  });

  player.load(config.mpd)
    .then(() => console.log("✅ Stream Loaded Successfully"))
    .catch(e => {
      console.error(e);
      alert("Stream load failed. Token might be expired.");
    });
}

// Start
fetchStreamConfig();
</script>
</body>
</html>
