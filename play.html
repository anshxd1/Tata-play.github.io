<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title id="title">Tata Play</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">

  <style>
    body, html { margin:0; padding:0; height:100%; background:#000; overflow:hidden; color:white; font-family:Arial, sans-serif; }
    .player-area { position:fixed; top:0; left:0; width:100vw; height:100dvh; }
    .header {
      position: absolute; top: 15px; left: 15px; z-index: 10000;
      background: rgba(0,0,0,0.85); padding: 12px 16px; border-radius: 12px;
      display: flex; align-items: center; gap: 12px;
    }
    .back-btn { font-size: 30px; color: white; text-decoration: none; }
    .status { 
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
      z-index: 100; text-align:center; background:rgba(0,0,0,0.7); padding:20px; border-radius:12px;
    }
  </style>
</head>
<body>

<div class="player-area">
  <div class="header">
    <a href="index.html" class="back-btn">←</a>
    <div><strong id="chName">Loading Channel...</strong><br><small id="chInfo">Tata Play</small></div>
  </div>

  <div class="status" id="status">Fetching stream config...</div>

  <div data-shaka-player-container style="width:100%; height:100%;">
    <video id="video" autoplay muted playsinline></video>
  </div>
</div>

<script>
const CORS_PROXY = "https://corsproxy.io/?";
const id = new URLSearchParams(location.search).get('id');

async function fetchStreamConfig() {
  try {
    const target = `https://allinonereborn.online/tplay/play.php?id=${id}`;
    const res = await fetch(CORS_PROXY + encodeURIComponent(target));
    const html = await res.text();

    // Extract the entire streamConfig object
    const match = html.match(/const streamConfig\s*=\s*(\{[\s\S]*?\n\s*\};)/);
    if (!match) throw new Error("Could not find streamConfig");

    let raw = match[1];

    // Very robust cleaning
    raw = raw
      .replace(/(\b\w+\b):/g, '"$1":')     // unquoted keys
      .replace(/'/g, '"')                  // single to double quotes
      .replace(/,\s*}/g, '}')              // trailing commas
      .replace(/,\s*([\]}])/g, '$1')
      .replace(/"https":/g, '"https": "https') // fix https:
      .trim();

    const streamConfig = JSON.parse(raw);

    // UI Update
    document.getElementById('chName').textContent = streamConfig.name || `Channel ${id}`;
    document.getElementById('title').textContent = streamConfig.name + " — Tata Play";
    document.getElementById('status').style.display = 'none';

    initPlayer(streamConfig);

  } catch (e) {
    console.error("Full Error:", e);
    document.getElementById('status').innerHTML = `❌ Parse Error<br><small>Check Console</small>`;
  }
}

function initPlayer(config) {
  shaka.polyfill.installAll();
  const video = document.getElementById('video');
  const container = document.querySelector('[data-shaka-player-container]');

  const player = new shaka.Player(video);
  new shaka.ui.Overlay(player, container, video);

  player.configure({
    drm: { clearKeys: config.drm || {} },
    streaming: { bufferingGoal: 30 }
  });

  player.getNetworkingEngine().registerRequestFilter((type, request) => {
    if (config.referer) request.headers['Referer'] = config.referer;
    if (config.userAgent) request.headers['User-Agent'] = config.userAgent;

    const url = request.uris[0];
    if (url.includes('manifest.mpd') || url.includes('/output/')) {
      const sep = url.includes('?') ? '&' : '?';
      request.uris[0] = url + sep + config.token;
    }
  });

  player.load(config.mpd).then(() => {
    console.log("Stream Loaded Successfully");
  }).catch(err => {
    console.error(err);
    alert("Failed to play stream");
  });
}

if (id) fetchStreamConfig();
else document.getElementById('status').textContent = "No ID in URL";
</script>
</body>
</html>
