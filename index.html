
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Tata Play Premium | Live TV Channels - Fully Responsive</title>
    <!-- Google Fonts & Smooth Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%);
            color: #eef2ff;
            scroll-behavior: smooth;
        }

        /* premium glassmorphism container */
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem 1.2rem 2.5rem;
        }

        /* header & branding - responsive */
        .premium-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.8rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 1rem;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .logo-icon {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #f5b042, #ff6a4b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo-text {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(120deg, #FFFFFF, #c0e0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .badge-premium {
            background: rgba(255,215,0,0.12);
            backdrop-filter: blur(4px);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
            border: 1px solid rgba(255,200,50,0.3);
            color: #ffdf8c;
        }
        .badge-premium i {
            margin-right: 5px;
        }

        /* search & filter bar - responsive flex */
        .control-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            background: rgba(18, 25, 45, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 0.6rem 1.2rem;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
        }
        .search-wrapper {
            flex: 2;
            min-width: 180px;
            display: flex;
            align-items: center;
            background: #0f1422;
            border-radius: 44px;
            padding: 0.2rem 0.8rem;
            border: 1px solid #2a2f42;
            transition: all 0.2s ease;
        }
        .search-wrapper:focus-within {
            border-color: #ff9f4a;
            box-shadow: 0 0 0 3px rgba(255,159,74,0.2);
        }
        .search-wrapper i {
            color: #a0a9c7;
            font-size: 0.95rem;
        }
        #searchInput {
            background: transparent;
            border: none;
            padding: 10px 10px;
            font-size: 0.9rem;
            color: white;
            width: 100%;
            outline: none;
            font-weight: 500;
        }
        #searchInput::placeholder {
            color: #6a6f8a;
            font-size: 0.85rem;
        }
        .category-dropdown {
            background: #0f1422;
            border-radius: 44px;
            padding: 0.2rem 0.6rem;
            border: 1px solid #2a2f42;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .category-dropdown i {
            font-size: 0.9rem;
            color: #ffb45e;
        }
        select {
            background: transparent;
            border: none;
            color: white;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 8px 5px;
            outline: none;
            cursor: pointer;
        }
        select option {
            background: #1a1f31;
            color: white;
        }
        .stats {
            font-size: 0.75rem;
            background: rgba(0,0,0,0.4);
            padding: 5px 14px;
            border-radius: 40px;
            white-space: nowrap;
        }

        /* ========== RESPONSIVE GRID: atleast 2 cards per row on mobile ========== */
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1.2rem;
            margin-top: 0.5rem;
        }

        /* premium card animation */
        .channel-card {
            background: rgba(20, 28, 48, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 15px 35px -12px rgba(0,0,0,0.5);
            transform: translateY(0px);
        }
        .channel-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255,180,70,0.4);
            box-shadow: 0 20px 30px -12px rgba(0,0,0,0.6);
            background: rgba(28, 38, 62, 0.9);
        }
        .card-img {
            background: #030614;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 0.5rem;
            height: 120px;
            position: relative;
        }
        .card-img img {
            max-width: 85%;
            max-height: 70px;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            transition: transform 0.25s ease;
        }
        .channel-card:hover .card-img img {
            transform: scale(1.02);
        }
        .live-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #e31b23;
            font-size: 0.6rem;
            font-weight: bold;
            padding: 3px 7px;
            border-radius: 30px;
            letter-spacing: 0.3px;
            box-shadow: 0 1px 3px black;
        }
        .card-info {
            padding: 0.8rem 0.6rem 1rem;
            text-align: center;
        }
        .channel-name {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fef7e0;
        }
        .channel-lang {
            font-size: 0.7rem;
            color: #a4b0d6;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .channel-lang i {
            font-size: 0.65rem;
        }
        .category-chip {
            display: inline-block;
            background: rgba(255,190,70,0.18);
            border-radius: 40px;
            padding: 0.15rem 0.6rem;
            font-size: 0.65rem;
            font-weight: 500;
            margin-top: 6px;
            color: #ffcf8a;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ========== MEDIA QUERIES: Guarantee at least 2 columns on mobile ========== */
        @media (max-width: 560px) {
            .channels-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.9rem;
            }
            .app-container {
                padding: 1rem 0.9rem 1.5rem;
            }
            .control-bar {
                border-radius: 32px;
                padding: 0.8rem;
                flex-direction: row;
                flex-wrap: wrap;
            }
            .search-wrapper {
                min-width: 100%;
                order: 1;
            }
            .category-dropdown {
                flex: 1;
                order: 2;
            }
            .stats {
                order: 3;
                text-align: center;
                flex: 0 0 auto;
            }
            .card-img {
                height: 105px;
                padding: 0.8rem 0.3rem;
            }
            .card-img img {
                max-height: 60px;
            }
            .channel-name {
                font-size: 0.85rem;
            }
            .channel-lang {
                font-size: 0.65rem;
            }
            .logo-text {
                font-size: 1.2rem;
            }
            .premium-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        /* For very narrow devices (below 380px) still 2 columns */
        @media (max-width: 380px) {
            .channels-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.7rem;
            }
            .card-info {
                padding: 0.6rem 0.4rem 0.8rem;
            }
            .channel-name {
                font-size: 0.8rem;
            }
        }

        /* Tablet landscape: 3-4 columns but still responsive */
        @media (min-width: 561px) and (max-width: 850px) {
            .channels-grid {
                grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            }
            .card-img {
                height: 115px;
            }
        }

        /* Desktop large screens */
        @media (min-width: 1200px) {
            .channels-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1.5rem;
            }
            .card-img {
                height: 135px;
            }
        }

        /* loading animation */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
            min-height: 350px;
            grid-column: 1 / -1;
        }
        .premium-loader {
            position: relative;
            width: 100px;
            height: 100px;
            margin-bottom: 1.5rem;
        }
        .premium-loader .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #ff9f4a;
            animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }
        .premium-loader .ring:nth-child(2) {
            width: 80%;
            height: 80%;
            top: 10%;
            left: 10%;
            border-top-color: #ff5e7c;
            animation-duration: 1.6s;
            animation-direction: reverse;
        }
        .premium-loader .ring:nth-child(3) {
            width: 55%;
            height: 55%;
            top: 22.5%;
            left: 22.5%;
            border-top-color: #7c4dff;
            animation-duration: 1s;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 1rem;
            font-weight: 500;
            background: linear-gradient(135deg, #ffb347, #ff7e5e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .loading-dots {
            display: inline-flex;
            gap: 4px;
            margin-left: 4px;
        }
        .loading-dots span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ff9f4a;
            animation: dotBounce 1.2s infinite;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        .error-box {
            text-align: center;
            padding: 2rem;
            background: rgba(220, 50, 50, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            margin-top: 1rem;
            border: 1px solid rgba(255, 80, 80, 0.3);
            grid-column: 1 / -1;
        }
        .retry-btn {
            background: linear-gradient(135deg, #ff9f4a, #ff6a4b);
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: transform 0.2s;
        }
        .no-results {
            text-align: center;
            padding: 2.5rem;
            background: rgba(0,0,0,0.3);
            border-radius: 1.5rem;
            margin-top: 1rem;
            grid-column: 1 / -1;
        }
        footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.7rem;
            color: #6c7393;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 1.5rem;
        }
        .channel-card {
            animation: fadeUp 0.4s ease backwards;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="premium-header">
        <div class="logo-area">
            <i class="fas fa-tower-broadcast logo-icon"></i>
            <span class="logo-text">Tata Play <span style="font-weight:400"></span></span>
        </div>
        <div class="badge-premium"><i class="fas fa-play-circle"></i> HD Channels</div>
    </div>

    <div class="control-bar">
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search channels by name, language...">
        </div>
        <div class="category-dropdown">
            <i class="fas fa-list-ul"></i>
            <select id="categorySelect">
                <option value="all">✨ All Categories</option>
            </select>
        </div>
        <div class="stats" id="statsInfo">
            <i class="fas fa-film"></i> <span id="channelCount">0</span> channels
        </div>
    </div>

    <div id="channelsContainer" class="channels-grid">
        <!-- dynamic loading animation will appear here -->
    </div>
    <footer>
        <i class="fas fa-shield-alt"></i> Tata Play style · Click any card to watch instantly · Fully responsive
    </footer>
</div>


<script>
    // ------------------------------------------------------------------
    // Fully responsive grid: atleast 2 cards per row on mobile
    // channels.json loader with dynamic mapping
    // ------------------------------------------------------------------
    let masterChannels = [];
    let uniqueCategories = new Set();

    const container = document.getElementById('channelsContainer');
    const searchInput = document.getElementById('searchInput');
    const categorySelect = document.getElementById('categorySelect');
    const channelCountSpan = document.getElementById('channelCount');

    // Beautiful loading animation
    function showLoadingAnimation() {
        container.innerHTML = `
            <div class="loading-container">
                <div class="premium-loader">
                    <div class="ring"></div>
                    <div class="ring"></div>
                    <div class="ring"></div>
                </div>
                <div class="loading-text">
                    <i class="fas fa-satellite-dish"></i> Fetching premium lineup
                    <div class="loading-dots"><span>.</span><span>.</span><span>.</span></div>
                </div>
                <div style="font-size:0.75rem; margin-top:0.7rem; opacity:0.7;">Loading high-quality channels...</div>
            </div>
        `;
        if (searchInput) searchInput.disabled = true;
        if (categorySelect) categorySelect.disabled = true;
    }

    function hideLoadingAndEnable() {
        if (searchInput) searchInput.disabled = false;
        if (categorySelect) categorySelect.disabled = false;
    }

    function getChannelLink(channelId) {
        return `player.html?id=${channelId}`;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    // render with responsive grid (automatically handled by CSS, but we apply card data)
    function renderChannels() {
        if (masterChannels.length === 0) return;
        const searchTerm = searchInput.value.trim().toLowerCase();
        const selectedCategory = categorySelect.value;

        let filtered = masterChannels.filter(channel => {
            if (selectedCategory !== 'all' && channel.category !== selectedCategory) return false;
            if (searchTerm !== '') {
                const nameMatch = channel.name.toLowerCase().includes(searchTerm);
                const langMatch = channel.language.toLowerCase().includes(searchTerm);
                const catMatch = channel.category.toLowerCase().includes(searchTerm);
                if (!(nameMatch || langMatch || catMatch)) return false;
            }
            return true;
        });

        channelCountSpan.innerText = filtered.length;

        if (filtered.length === 0) {
            container.innerHTML = `<div class="no-results"><i class="fas fa-tv-slash" style="font-size: 2rem; opacity:0.6;"></i><h3 style="margin-top:0.7rem; font-size:1.2rem;">No channels found</h3><p>Try adjusting search or category ✨</p></div>`;
            return;
        }

        let cardsHTML = '';
        filtered.forEach((channel, idx) => {
            const logoUrl = channel.logo && channel.logo.trim() !== '' ? channel.logo : 'https://via.placeholder.com/150x80?text=No+Signal';
            const liveStatus = channel.live === true ? '<span class="live-badge"><i class="fas fa-circle" style="font-size: 0.45rem; margin-right: 3px;"></i> LIVE</span>' : '';
            const watchLink = getChannelLink(channel.id);
            // animation delay staggered
            const delayStyle = `animation-delay: ${(idx % 15) * 0.02}s;`;
            cardsHTML += `
                <div class="channel-card" data-id="${channel.id}" data-link="${watchLink}" style="${delayStyle}">
                    <div class="card-img">
                        <img src="${logoUrl}" alt="${escapeHtml(channel.alt || channel.name)}" loading="lazy" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/4212/4212867.png';">
                        ${liveStatus}
                    </div>
                    <div class="card-info">
                        <div class="channel-name">${escapeHtml(channel.name)}</div>
                        <div class="channel-lang">
                            <i class="fas fa-language"></i> ${escapeHtml(channel.language)}
                        </div>
                        <div class="category-chip"><i class="fas fa-tag"></i> ${escapeHtml(channel.category)}</div>
                    </div>
                </div>
            `;
        });
        container.innerHTML = cardsHTML;

        // attach click handlers for redirection
        document.querySelectorAll('.channel-card').forEach(card => {
            card.addEventListener('click', (e) => {
                e.stopPropagation();
                const link = card.getAttribute('data-link');
                if (link) {
                    window.location.href = link;
                } else {
                    const id = card.getAttribute('data-id');
                    if (id) window.location.href = getChannelLink(id);
                }
            });
        });
    }

    function updateCategoryDropdown() {
        let options = '<option value="all">✨ All Categories</option>';
        const sortedCats = Array.from(uniqueCategories).sort();
        sortedCats.forEach(cat => {
            options += `<option value="${escapeHtml(cat)}">📺 ${escapeHtml(cat)}</option>`;
        });
        categorySelect.innerHTML = options;
        categorySelect.value = 'all';
    }

    function showErrorWithRetry(errorMsg) {
        container.innerHTML = `
            <div class="error-box">
                <i class="fas fa-broadcast-tower" style="font-size: 2.5rem;"></i>
                <h3 style="margin: 0.5rem 0;">Connection Issue</h3>
                <p>⚠️ ${escapeHtml(errorMsg)}<br>Could not load channels.json.<br>Make sure file exists in same folder.</p>
                <button class="retry-btn" id="retryLoadBtn"><i class="fas fa-sync-alt"></i> Retry Loading</button>
                <div style="margin-top: 0.8rem; font-size: 0.7rem;"><i class="fas fa-folder-open"></i> Expected: ./channels.json</div>
            </div>
        `;
        const retryBtn = document.getElementById('retryLoadBtn');
        if (retryBtn) retryBtn.addEventListener('click', () => loadChannels());
        hideLoadingAndEnable();
        channelCountSpan.innerText = '0';
    }

    async function loadChannels() {
        showLoadingAnimation();
        masterChannels = [];
        uniqueCategories.clear();

        try {
            // small delay for smooth animation visibility
            await new Promise(resolve => setTimeout(resolve, 300));
            const response = await fetch('./channels.json?t=' + Date.now());
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            if (!Array.isArray(data) || data.length === 0) throw new Error('Empty or invalid channels array');

            masterChannels = data;
            masterChannels.forEach(ch => {
                if (!ch.category || typeof ch.category !== 'string') ch.category = "Entertainment";
                uniqueCategories.add(ch.category);
                if (!ch.language) ch.language = "Multi Language";
                if (!ch.name) ch.name = "Channel";
                if (!ch.id) ch.id = "0";
                if (ch.live === undefined) ch.live = true;
                if (!ch.logo) ch.logo = "";
            });

            updateCategoryDropdown();
            hideLoadingAndEnable();
            renderChannels();
        } catch (err) {
            console.error(err);
            let friendlyMsg = err.message.includes('fetch') ? 'Network error: cannot fetch channels.json' : err.message;
            showErrorWithRetry(friendlyMsg);
        }
    }

    // debounce for search
    let debounceTimer;
    function debouncedRender() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            if (masterChannels.length) renderChannels();
        }, 220);
    }

    searchInput.addEventListener('input', () => {
        if (masterChannels.length) debouncedRender();
    });
    categorySelect.addEventListener('change', () => {
        if (masterChannels.length) renderChannels();
    });

    loadChannels();
</script>
</body>
</html>
